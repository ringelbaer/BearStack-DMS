    DocumentCustomValue:
      type: object
      required: [field_id, label, value]
      properties:
        field_id:
          type: integer
          format: int64
          minimum: 1
        label:
          type: string
        value:
          type: string

    DocumentFilter:
      type: object
      required:
        - query
        - tags
        - custom_fields
        - sort
        - direction
        - trash
      properties:
        query:
          type: string
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldFilter"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        year:
          type: integer
          minimum: 1900
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        sort:
          type: string
          enum: [upload_date, date, name, title, size, deleted_at]
        direction:
          type: string
          enum: [asc, desc]
        trash:
          type: boolean

    CustomFieldFilter:
      type: object
      required: [field_id, value]
      properties:
        field_id:
          type: integer
          format: int64
          minimum: 1
        value:
          type: string

    Pagination:
      type: object
      required: [page, per_page, total, start, end, has_prev, has_next]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          enum: [25, 50, 100, 200, 500]
        total:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        has_prev:
          type: boolean
        has_next:
          type: boolean

    CustomField:
      type: object
      required:
        - id
        - label
        - position
        - autocomplete_enabled
        - value_folder_min_documents
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        label:
          type: string
        position:
          type: integer
          minimum: 0
        autocomplete_enabled:
          type: boolean
        value_folder_min_documents:
          description: |
            `0` disables value folders, `1` always shows them, and higher
