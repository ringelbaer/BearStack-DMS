openapi: 3.1.0
info:
  title: BearStack HTTP API
  version: 0.41.0
  description: |
    Programmatic HTTP interface for documents, uploads, tags, custom fields,
    virtual folders and document media.

    BearStack accepts HTTP Basic authentication with the configured credentials.
    A browser session cookie obtained through the web login is accepted as well.
    When authentication is disabled in the server configuration, the security
    requirements are not enforced.

    Write operations require the capabilities stated in their descriptions.
    API clients using form endpoints should send `Accept: application/json`.
servers:
  - url: /
    description: Current BearStack instance
security:
  - basicAuth: []
  - sessionCookie: []
tags:
  - name: Photos
    description: Optional photo library and local face recognition.
  - name: System
    description: Service status and API description.
  - name: Documents
    description: Document search, metadata and file delivery.
  - name: Upload
    description: Document import.
  - name: Structure
    description: Tags, custom fields and virtual folders.

paths:
  /api/photos/labeling/v1/faces/{id}/favorite:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [Photos]
      operationId: getLabelingFaceFavorite
      summary: Read a face's reference favorite status
      description: >-
        Available since BearStack 0.40.0. Requires photos.edit. Returns the current
        person and favorite status of an active face. Private, ignored, removed
        and stale source images are excluded. Cache-Control is private, no-store.
      responses:
        "200":
          description: Current favorite state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FaceFavorite"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Photos]
      operationId: setLabelingFaceFavorite
      summary: Set a face's reference favorite status
      description: >-
        Available since BearStack 0.40.0. Requires photos.edit. Supports named and
        unnamed groups. Set the desired boolean explicitly; repeated identical
        requests are idempotent. person_id must be the current group ID to protect
        against stale assignments. A moved or ignored face returns 409 conflict;
        removed faces return 404. Refresh the group after a conflict. Later explicit
        assignments replace earlier ones; clients should serialize writes per face.
        Favorite state and that person's reference selection are saved atomically.
        All eligible favorites are compared even above the configured reference
        target; remaining slots favor distinct gallery folders. Favorites survive
        reassignment and merging, but ignored/private faces never participate in
        matching. Clients can discover support using session.face_favorites and
        read faces[].favorite on person detail pages. Cache-Control is private,
        no-store. Browser clients must satisfy the same-origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id, favorite]
              properties:
                person_id: {type: integer, format: int64, minimum: 1}
                favorite: {type: boolean}
            example: {person_id: 12, favorite: true}
      responses:
        "200":
          description: Persisted favorite state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FaceFavorite"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Face was moved or ignored. Refresh the group before retrying.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, const: conflict}
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/session:
    get:
      tags: [Photos]
      operationId: getLabelingSession
      summary: Check labeling protocol, identity and rights
      description: |
        Requires photos.edit. Clients must use HTTPS. Protocol 1 is available from
        BearStack 0.30.0. Persist queue state under instance + dataset + account.
        upper_id freezes the next candidate pass. Clearing face data rotates dataset.
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/candidates:
    get:
      tags: [Photos]
      operationId: getLabelingCandidates
      summary: Read unnamed groups within a bounded pass
      description: |
        Requires photos.edit. At most 20 metadata records, ordered by ID, with no
        face images or embeddings. Newer groups are excluded. Before display,
        re-read the group. Detached groups must be placed in a local priority queue.
      parameters:
        - name: after
          in: query
          required: false
          description: Exclusive ID cursor; initially zero.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: upper
          in: query
          required: true
          description: Fixed upper_id returned by the session at the start of this pass.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingCandidates"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/people/{id}:
    get:
      tags: [Photos]
      operationId: getLabelingPerson
      summary: Read a consistent group revision and four faces
      description: |
        Requires photos.edit. count is the entire active face count, not the page
        size or distinct photo count. Empty, ignored and deleted groups return 404.
        Protected photos are excluded even for administrators.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Zero-based face offset. Four faces ordered by ID; default zero.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingPerson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/suggestions:
    get:
      tags: [Photos]
      operationId: getLabelingSuggestions
      summary: Find up to twenty named people
      description: |
        Requires photos.edit. Returns named groups with revisions, preview face IDs
        and total active face counts. No embeddings. Duplicate names are allowed
        only after an explicit allow_duplicate decision on the name action.
      parameters:
        - name: q
          in: query
          required: false
          description: Name substring (maximum 800 UTF-8 bytes).
          schema:
            type: string
        - name: exact
          in: query
          required: false
          description: Set to 1 for a whitespace-normalized, case-sensitive exact name match.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingSuggestions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/people/{id}/actions:
    post:
      tags: [Photos]
      operationId: applyLabelingAction
      summary: Atomically change a whole group or detach one face
      description: |
        Requires photos.edit. Source must still be unnamed. JSON is limited to 16 KiB.
        All active faces are changed in one transaction with the receipt; there is
        no 500-face limit or client-side batching. Images are never deleted.
        operation_id is unique per account and dataset. An identical replay returns
        the original receipt, including after the source has disappeared. Changed
        content under the same ID returns 409. Source and target revisions must
        match; web edits and background changes also advance revisions.
        A 409 requires a fresh read and a new explicit user decision, with a new ID.
        name_exists allows the client to offer assignment or separate naming.
        Ignore undo is a client-side delay BEFORE sending this request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelingAction"
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "409":
          description: Stale source/target revision, reused operation ID, changed dataset or existing name.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, enum: [conflict, name_exists]}

  /api/photos/labeling/v1/actions/{operation}:
    get:
      tags: [Photos]
      operationId: getLabelingReceipt
      summary: Resolve an action after a lost response
      description: |
        Requires photos.edit. Only the requesting account can retrieve its receipt.
        404 means no receipt in this dataset; the client may resend the identical
        saved request. Receipts remain available until face data is cleared.
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
        - name: dataset
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/faces/{id}/thumbnail:
    get:
      tags: [Photos]
      operationId: getLabelingFaceImage
      summary: Get an authorized face crop
      description: Requires photos.edit. Protected and ignored faces are excluded; no embeddings or original photos are returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: size
          in: query
          required: false
          description: Small or enlarged face crop size. Use the original endpoint for the full source photo.
          schema:
            type: integer
            format: int64
            minimum: 0
            enum: [160, 640]
            default: 160
      responses:
        "200":
          description: Square JPEG crop. Cache-Control is private, no-store.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/faces/{id}/original:
    get:
      tags: [Photos]
      operationId: getLabelingFaceOriginal
      summary: Get the full original photo containing a face
      description: >-
        Available since BearStack 0.33.0. Requires photos.edit. Streams the
        unchanged source file, preserving its dimensions and metadata. The path
        is resolved from the face ID; protected and ignored faces are excluded.
        Responses use Cache-Control no-store. Supports HTTP byte ranges.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Range
          in: header
          schema: {type: string}
          description: Optional byte range, for example bytes=0-1023.
      responses:
        "200":
          description: Original photo with its source MIME type.
          content:
            "image/*":
              schema: {type: string, format: binary}
        "206":
          description: Requested byte range of the original photo.
          content:
            "image/*":
              schema: {type: string, format: binary}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested byte range cannot be satisfied.
        "500":
          $ref: "#/components/responses/InternalServerError"

  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check service health
      description: Requires authentication when authentication is enabled.
      responses:
        "200":
          description: The HTTP service is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPIDescription
      summary: Download this OpenAPI description
      description: |
        Returns the OpenAPI description embedded in the running BearStack
        version. Requires any document or photo API capability.
      responses:
        "200":
          description: OpenAPI description in YAML format.
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/upload:
    post:
      tags: [Upload]
      operationId: uploadDocuments
      summary: Upload one or more documents
      description: |
        Imports every file part as a document. Files exceeding the configured
        upload limit, unsupported file types and duplicates are reported per
        item. Requires the `documents.upload` capability.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
            encoding:
              files:
                style: form
                explode: true
      responses:
        "201":
          description: |
            The request was processed and at least one file was imported, was a
            duplicate, or did not produce a per-file error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: No document was imported and at least one error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Search and list documents
      description: |
        Returns a paginated list using the same filters as the web interface.
        Search strings shorter than three Unicode characters are ignored.
        Requires the `documents.read` capability.

        Custom field filters use dynamic query parameter names in the form
        `field_{id}`, for example `field_3=ACME`. The first non-empty value per
        field is used and matching is case-insensitive.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagsQuery"
        - name: field_{id}
          in: query
          description: |
            Custom field value filter. Replace `{id}` in the parameter name
            with a positive custom field ID, for example `field_3`.
          schema:
            type: string
        - name: from
          in: query
          description: Earliest document date. Ignored when `year` is valid.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest document date. Ignored when `year` is valid.
          schema:
            type: string
            format: date
        - name: year
          in: query
          description: Document year; takes precedence over `from` and `to`.
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - name: month
          in: query
          description: Optional month when a valid `year` is supplied.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: sort
          in: query
          description: Unknown values fall back to `upload_date`.
          schema:
            type: string
            enum: [upload_date, date, name, title, size, deleted_at]
            default: upload_date
        - name: dir
          in: query
          description: |
            Sort direction. Defaults to `asc` for name/title and `desc` for all
            other sort keys.
          schema:
            type: string
            enum: [asc, desc]
        - name: trash
          in: query
          description: |
            Lists deleted documents for `1`, `true`, `yes` or `ja`
            (case-insensitive).
          schema:
            oneOf:
              - type: boolean
              - type: string
                enum: ["1", "true", "yes", "ja"]
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated document result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/documents/{id}/download:
    get:
      tags: [Documents]
      operationId: downloadDocumentFromAPI
      summary: Download an original document through the API alias
      description: Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document or stored file not found.

  /api/fields:
    get:
      tags: [Structure]
      operationId: listCustomFields
      summary: List custom field definitions
      description: Requires the `documents.read` capability.
      responses:
        "200":
          description: Custom field definitions in display order.
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomField"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/folders:
    get:
      tags: [Structure]
      operationId: listVirtualFolder
      summary: List a virtual folder
      description: |
        Traverses BearStack's virtual hierarchy of tags, custom field values and
        saved searches. Requires the `documents.read` capability.

        `path` is the preferred representation and accepts repeated segments:
        `tag:{name}` or `field:{fieldId}:{exactValue}`. When `path` is absent,
        repeated `tags` values provide the legacy tags-only representation.

        At the root only child folders are returned. Documents are returned once
        at least one normal path segment is selected. The special legacy path
        `tags=00 Suchfavoriten` lists saved searches, and a second tag selects
        one. Search, date and trash query filters are ignored for normal virtual
        folders.
      parameters:
        - name: path
          in: query
          description: Ordered virtual path segments.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: "^(tag:.+|field:[1-9][0-9]*:.+)$"
        - $ref: "#/components/parameters/TagsQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Child folders and documents at the selected path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/tags:
    get:
      tags: [Structure]
      operationId: listTags
      summary: List document tags
      description: Requires the `documents.read` capability.
      responses:
        "200":
          description: All document tags.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/download:
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: Download an original document
      description: Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document or stored file not found.

  /documents/{id}/preview:
    get:
      tags: [Documents]
      operationId: previewDocument
      summary: Retrieve an inline document preview
      description: |
        Returns the original PDF/image or a generated PDF for supported office
        and text formats. Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Inline original or generated preview.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document not found.
        "415":
          description: This document type cannot be previewed.
        "503":
          description: Preview dependency is unavailable.

  /documents/{id}/thumbnail:
    get:
      tags: [Documents]
      operationId: getDocumentThumbnail
      summary: Retrieve a document thumbnail
      description: |
        Generates the thumbnail on demand when possible. Requires the
        `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: JPEG thumbnail.
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=86400
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document or thumbnail not found.

  /documents/{id}/tags:
    post:
      tags: [Documents]
      operationId: replaceDocumentTags
      summary: Replace all tags on a document
      description: |
        Existing tags can be assigned with `documents.edit`. Creating a new tag
        additionally requires `documents.structure`. Deleted documents cannot be
        changed. Send `Accept: application/json`.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
            encoding:
              tags:
                style: form
                explode: true
      responses:
        "200":
          description: Normalized, stored tag names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTags"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/metadata:
    post:
      tags: [Documents]
      operationId: updateDocumentMetadata
      summary: Update document metadata
      description: |
        Replaces title, description, date, tags and custom field values.
        Custom fields use form field names `field_{id}`, for example `field_3`.
        Existing tags can be assigned with `documents.edit`; creating a new tag
        additionally requires `documents.structure`. Send
        `Accept: application/json`.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                document_date:
                  description: Empty to clear the date.
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      maxLength: 0
                tags:
                  type: array
                  items:
                    type: string
                new_tags:
                  type: string
                  description: Additional comma-separated tags.
                field_{id}:
                  type: string
                  description: |
                    Custom field value. Replace `{id}` in the form field name
                    with a positive custom field ID.
              additionalProperties:
                type: string
            encoding:
              tags:
                style: form
                explode: true
      responses:
        "200":
          description: Selected values from the updated metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/document-date:
    post:
      tags: [Documents]
      operationId: updateDocumentDate
      summary: Update only the document date
      description: Requires `documents.edit` and always returns JSON.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                document_date:
                  description: Empty to clear the date.
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      maxLength: 0
      responses:
        "200":
          description: Formatted updated date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDateUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/ocr/status:
    get:
      tags: [Documents]
      operationId: getDocumentOCRStatus
      summary: Get the latest OCR job
      description: Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Latest OCR job, or `null` when none exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OCRStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /photos/people/groups:
    get:
      tags: [Photos]
      operationId: getGroupPhotos
      summary: Browse group photos with remaining unnamed faces
      description: >-
        Available since 0.41.0. Requires photos.edit. Without path, returns the first
        eligible photo after the path cursor, in ascending path order. Eligibility
        requires strictly more than min faces whose person has no name and which
        are not ignored. Private, missing and stale sources are excluded. A path
        selects the current photo even after its remaining count falls below min;
        path takes precedence over after. All recognized faces, including named and
        ignored ones, are included in the photo detail. No embeddings are exposed.
        Skipping advances only the cursor; it never changes stored face data.
        Omit after and path to start a new pass. HTML by default; request format=json
        or Accept application/json for JSON. Cache-Control is private, no-store.
      parameters:
        - name: min
          in: query
          schema: {type: integer, minimum: 0, maximum: 255, default: 5}
          description: Exclusive threshold for remaining faces; five means at least six.
        - name: after
          in: query
          schema: {type: string, maxLength: 4096}
          description: Gallery-relative path cursor; omitted starts at the beginning.
        - name: path
          in: query
          schema: {type: string, minLength: 1, maxLength: 4096}
          description: Read this current photo regardless of its remaining count.
        - name: format
          in: query
          schema: {type: string, enum: [json]}
      responses:
        '200':
          description: Current photo, or null when no eligible photo remains.
          content:
            text/html:
              schema: {type: string}
            application/json:
              schema: {$ref: '#/components/schemas/GroupPhotosPage'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/people/groups/ignore:
    post:
      tags: [Photos]
      operationId: ignoreGroupPhotoRemainingFaces
      summary: Ignore the current photo's remaining unnamed faces atomically
      description: >-
        Available since 0.41.0. Requires photos.edit and the browser same-origin
        policy. Pass the path and revision of the displayed photo. The revision is
        checked in the same write transaction as the selection and mutation. Named
        or already ignored faces and faces in other photos are never affected.
        A changed snapshot returns 409 without partial edits; refresh the photo
        before retrying. JSON success acknowledges only the write. Then GET the
        group photo view using after=path to advance. If this GET fails, retry only
        navigation. HTML form success redirects to the next eligible photo. For
        naming and assignment, the UI uses the existing whole-person rename/merge
        endpoints, not individual-face movement. Responses use Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [path, revision]
              properties:
                path: {type: string, minLength: 1, maxLength: 4096}
                revision: {type: string, minLength: 64, maxLength: 64, description: Opaque snapshot revision from GroupPhoto.}
                min: {type: integer, minimum: 0, maximum: 255, default: 5, description: Threshold retained for the HTML redirect.}
      responses:
        '200':
          description: Write completed for requests with Accept application/json.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ignored]
                properties:
                  ok: {type: boolean, const: true}
                  ignored: {type: integer, minimum: 0, maximum: 256}
        '303':
          description: Redirect to the next eligible photo for HTML forms.
          headers:
            Location:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Photo changed; refresh and review the remaining faces.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, const: conflict}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/people/groups/image/{id}:
    get:
      tags: [Photos]
      operationId: getGroupPhotoImage
      summary: Get the proportionally fitted full-photo preview for a face
      description: >-
        Available since 0.41.0. Requires photos.edit. Resolves the original from a
        recognized face, including ignored faces still present in the group editor.
        Reuses the EXIF-oriented gallery preview of at most 1600 pixels. Falls back
        to the original when no thumbnail backend is available. Private, removed
        or replaced sources are rejected. Returns an image with Cache-Control no-store.
        Face bounds are normalized in the EXIF-oriented image, not in the square
        face thumbnails; clients must account for letterboxing when highlighting.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Full-photo preview, or original fallback.
          content:
            'image/*':
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/people:
    get:
      tags:
      - Photos
      operationId: listPhotoPeople
      summary: List automatically grouped people
      description: 'Requires photos.read. HTML by default; format=json or Accept: application/json
        returns a page of at most 60 groups. With ignored=1, returns up to 60 individual
        ignored faces in faces and an empty people array. Admin-only photos are excluded.'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: q
        in: query
        schema:
          type: string
      - name: ignored
        in: query
        description: Set to 1 to list ignored faces, including faces in groups without active faces. Combines with q, known and pagination.
        schema:
          type: string
          enum: ['0', '1']
          default: '0'
      - name: known
        in: query
        description: Set to 1 to list only people with a non-empty name; combines with q and pagination.
        schema:
          type: string
          enum: ['0', '1']
          default: '0'
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
        description: Request JSON instead of HTML.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPeoplePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /photos/people/{id}:
    get:
      tags:
      - Photos
      operationId: getPhotoPerson
      summary: List faces assigned to one person
      description: 'Requires photos.read. HTML by default; format=json or Accept: application/json
        returns at most 60 faces. Empty/hidden groups return 404.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
        description: Request JSON instead of HTML.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPeoplePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /photos/faces/{id}/thumbnail:
    get:
      tags:
      - Photos
      operationId: getFaceThumbnail
      summary: Get a face crop
      description: Requires photos.read. Checks current filesystem visibility; generated
        crops use private browser caching with mandatory revalidation and ETags.
        Matching If-None-Match returns 304 only after authentication and visibility
        checks. Encoded crops are cached in the configured photo cache.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 160 x 160 JPEG face preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Cached face preview is unchanged; no response body.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/people/{id}/rename:
    post:
      tags:
      - Photos
      operationId: renamePhotoPerson
      summary: Name or rename a person
      description: Requires photos.edit. Form writes redirect to the corresponding
        HTML page; Accept application/json returns an OK object without redirect. Existing authentication, same-origin protection and audit logging
        apply.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
              required: []
      responses:
        '200':
          description: Saved (Accept application/json); response is not cached.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/people/{id}/merge:
    post:
      tags:
      - Photos
      operationId: mergePhotoPeople
      summary: Merge source group into target
      description: Requires photos.edit. Form writes redirect to the corresponding
        HTML page. Existing authentication, same-origin protection and audit logging
        apply. Additional person_id sources merge atomically (at most 60 distinct sources,
        excluding the target). An unnamed target inherits the first non-empty source
        name, including its provenance; a named target keeps its name. Accept
        application/json returns 200 with ok true. Optional new_name atomically renames the target while merging; it must be non-empty.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                new_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Optional manual target name applied in the merge transaction.
                person_id:
                  type: array
                  description: Additional source group IDs; repeated form field.
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                target:
                  type: integer
                  format: int64
                  minimum: 1
              required:
              - target
      responses:
        '200':
          description: Groups merged (Accept application/json).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/faces/{id}/favorite:
    post:
      tags: [Photos]
      operationId: setPhotoFaceFavoriteForm
      summary: Set a reference favorite from a person detail form
      description: >-
        Available since BearStack 0.40.0. Requires photos.edit and same-origin
        browser requests. HTML fallback for the web favorite button. The expected
        person and explicit desired state follow the JSON favorite API contract.
        Success always redirects to the person detail page, preserving page.
        Errors use JSON with error and code. API clients should prefer the PUT
        endpoint under /api/photos/labeling/v1/faces/{id}/favorite.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [person_id, favorite]
              properties:
                person_id: {type: integer, format: int64, minimum: 1}
                favorite: {type: string, enum: ['0', '1']}
                page: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      responses:
        '303':
          description: Favorite saved; redirect to the person detail page.
          headers:
            Location:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The face was moved to another group or ignored; refresh before retrying.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/faces/edit:
    post:
      tags:
      - Photos
      operationId: editPhotoFaces
      summary: Move selected faces or ignore false detections
      description: Requires photos.edit. Form writes redirect to the corresponding
        HTML page; requests with Accept application/json receive HTTP 200 with an ok flag. Existing authentication, same-origin protection and audit logging
        apply.
      parameters: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                face_id:
                  type: array
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                  minItems: 1
                  maxItems: 500
                action:
                  type: string
                  enum:
                  - move
                  - ignore
                target:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Existing target person ID; 0 or omitted creates a new
                    person for move.
                name:
                  type: string
                  maxLength: 200
                  description: Name for the new person. Required and non-blank when ignored=1, action=move and target=0. Moving an ignored face restores it.
                ignored:
                  type: string
                  enum: ['0', '1']
                  description: Set to 1 to return HTML form submissions to the ignored-face filter.
                q:
                  type: string
                  description: Name filter preserved in the ignored-face HTML redirect.
                known:
                  type: string
                  enum: ['0', '1']
                  description: Named-only filter preserved in the ignored-face HTML redirect.
                page:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: Page preserved in the ignored-face HTML redirect.
              required:
              - face_id
              - action
      responses:
        '200':
          description: Saved (Accept application/json).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings/photos/faces:
    get:
      tags:
      - Photos
      operationId: getFaceRecognitionSettings
      summary: Recognition settings and progress
      description: Requires photos.manage. HTML by default; format=json returns settings
        and status. Service tokens and vectors are never returned.
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
        description: Request JSON instead of HTML.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceSettingsStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Photos
      operationId: saveFaceRecognitionSettings
      summary: Configure optional face recognition
      description: Requires photos.manage. Form writes redirect to the corresponding
        HTML page. Existing authentication, same-origin protection and audit logging
        apply.
      parameters: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum:
                  - '1'
                  description: Omit to pause. Activation requires a healthy, compatible
                    configured service.
                batch_size:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
                delay_millis:
                  type: integer
                  minimum: 100
                  maximum: 60000
                  default: 1000
                reference_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
                  description: Target references per person. All eligible favorites are included,
                    even above this target. Remaining slots favor distinct gallery folders.
                    Omission preserves the existing value. Changes refresh stored references
                    before the next analysis, without analyzing photos again.
                interval_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 15
              required: []
      responses:
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings/photos/faces/{action}:
    post:
      tags:
      - Photos
      operationId: controlFaceRecognition
      summary: Pause, resume, retry or delete recognition data
      description: Requires photos.manage. Form writes redirect to the corresponding
        HTML page. Existing authentication, same-origin protection and audit logging
        apply. The clear action additionally requires the current password of the
        authenticated user; failed confirmation leaves data and processing unchanged.
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - pause
          - resume
          - retry
          - clear
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  enum:
                  - delete
                  description: Required for clear; deletes generated data and disables
                    processing, preserving XMP.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Required for clear; current password of the authenticated user.
              required: []
      responses:
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Too many failed password confirmations.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/media/info:
