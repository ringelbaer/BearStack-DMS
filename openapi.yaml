openapi: 3.1.0
info:
  title: BearStack HTTP API
  version: 0.50.0
  description: |
    Programmatic HTTP interface for documents, uploads, tags, custom fields,
    virtual folders and document media.

    BearStack accepts HTTP Basic authentication with the configured credentials.
    A browser session cookie obtained through the web login is accepted as well.
    When authentication is disabled in the server configuration, the security
    requirements are not enforced.

    Write operations require the capabilities stated in their descriptions.
    API clients using form endpoints should send `Accept: application/json`.
servers:
  - url: /
    description: Current BearStack instance
security:
  - basicAuth: []
  - sessionCookie: []
tags:
  - name: Photos
    description: Optional photo library and local face recognition.
  - name: System
    description: Service status and API description.
  - name: Documents
    description: Document search, metadata and file delivery.
  - name: Upload
    description: Document import.
  - name: Structure
    description: Tags, custom fields and virtual folders.

paths:
  /api/photos/v1/session:
    get:
      tags:
      - Photos
      operationId: getPhotoCatalogSession
      summary: Check native gallery protocol, identity and capabilities
      description: Requires photos.read. Available from BearStack 0.50.0. Does not modify photo content.
      responses:
        '200':
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogSession'
        '400':
          description: Invalid path, page, section or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '422':
          description: Search too broad; refine the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only content. Error shape follows the access middleware or catalog code.
  /api/photos/v1/map:
    get:
      tags: [Photos]
      operationId: mapPhotoCatalog
      summary: Read clustered GPS locations for a native map
      description: >-
        Requires photos.read. Recursively aggregates the complete indexed folder or global search,
        excluding admin-only content. At most 289 markers are returned for the requested viewport;
        total counts every matching GPS item, with no media-page truncation. A marker with count 1
        includes a path for media/info. Supply all four bounds or omit all for a world overview.
        West greater than east crosses the antimeridian. Search uses the gallery query planner;
        complex searches exceeding its candidate budget return 422 rather than partial results.
        An index that has not yet scanned the requested folder returns 503.
      parameters:
      - name: path
        in: query
        schema: {type: string, default: ''}
        description: Library-relative folder. Subfolders are included. Nonempty q searches the whole library.
      - name: q
        in: query
        schema: {type: string}
        description: Shared gallery search syntax, maximum 800 UTF-8 bytes.
      - name: type
        in: query
        schema: {type: string, enum: [image, video, audio]}
      - name: south
        in: query
        schema: {type: number, format: double, minimum: -90, maximum: 90}
      - name: north
        in: query
        schema: {type: number, format: double, minimum: -90, maximum: 90}
        description: Must be greater than south.
      - name: west
        in: query
        schema: {type: number, format: double, minimum: -180, maximum: 180}
      - name: east
        in: query
        schema: {type: number, format: double, minimum: -180, maximum: 180}
        description: Must differ from west. Use west -180 and east 180 for all longitudes.
      responses:
        '200':
          description: GPS markers and their geographic extent. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMap'
        '400':
          description: Invalid path, query, type or bounds (invalid_bounds).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only folder.
        '404':
          description: Folder not found.
        '422':
          description: Search exceeds candidate budget (search_too_broad).
        '503':
          description: Photo index not ready (map_index_not_ready). Retry-After is 10 seconds.
        '500':
          description: Internal error.
  /api/photos/v1/map/tracks:
    get:
      tags: [Photos]
      operationId: listPhotoMapTracks
      summary: Read a bounded inventory of GPX tracks
      description: >-
        Requires photos.read. Returns file metadata without parsing GPX. Includes the folder's
        descendants; admin-only files are excluded, including newly private folders not yet rescanned.
        Numeric cursors advance over at most 32 candidate files and do not expose hidden paths.
        A page may be empty with has_next or has_previous true. Use cursor to continue forwards or
        previous_cursor with before=1 to continue backwards. File IDs survive metadata updates.
        ready=false means a normal index scan still needs to backfill GPX inventory; existing photo
        map coverage remains available. The browser reuses this inventory and lazily parses tracks;
        it retains its filesystem fallback until inventory backfill is complete.
        Inventory queries are independent of photo search terms.
      parameters:
      - name: path
        in: query
        schema: {type: string, maxLength: 4096, default: ''}
        description: Library-relative folder. Empty selects the full library.
      - name: cursor
        in: query
        schema: {type: string, pattern: '^[0-9]*$', default: ''}
      - name: before
        in: query
        schema: {type: integer, enum: [0, 1], default: 0}
      responses:
        '200':
          description: Bounded metadata inventory. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoTrackInventory'}
        '400':
          description: Invalid path or cursor (invalid_cursor).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only folder.
        '404':
          description: Folder not found.
        '503':
          description: Index unavailable (map_index_not_ready). Retry-After is 10 seconds.
        '500':
          description: Internal error.
  /api/photos/v1/map/route:
    get:
      tags: [Photos]
      operationId: readPhotoMapRoute
      summary: Read the chronological photo route for a folder or search
      description: >-
        Requires photos.read. Uses the complete indexed GPS selection with the same folder,
        search and visibility predicates as the map. Subfolders are included; q searches the
        whole library. Admin-only content is excluded. Points are ordered by capture time
        (file modification time if absent), normalizing offsets and full fractional precision.
        The shared browser algorithm groups nearby consecutive places using the configured
        map track resolution and successive time windows, before clipping to the viewport.
        Current folder privacy rules are checked in bounded batches for maps, map media and
        photo routes, including newly private subfolders before the next regular index scan.
        No originals are read. Optional map indexes on populated databases build after startup,
        outside the base-schema timeout, with file-backed sorting. Map requests wait cancellably
        for completion; regular gallery reads remain available. Interrupted builds retry on restart.
        Without full-text search, input streams in index order; full-text
        matches are read once and sorted with file-backed temporary storage. Aggregation and
        geometry storage are bounded; large SQL-supported selections are not truncated. Complex
        postfilters retain the explicit search_too_broad error rather than returning a partial route.
        The entire route determines bounds, total_media and total_points. Segments contain only
        viewport geometry, with at most points coordinates across all segments. Reduction and
        omitted viewport segments are reported. Supply all four bounds or omit all for the world.
        GPX and photo routes share at most two geometry jobs per library.
        Complete grouped routes without q are cached server-side as versioned JSON in the
        configured cache directory, shared with the browser map independently of its media page. Cache scope includes library, recursive folder, radius,
        media type and visibility. A transactional index revision invalidates GPS, timestamps,
        folder, type and access changes, including descendants. Schema 27 scopes revisions by
        directory, media type and visibility; unrelated subtrees and selections retain their caches.
        Moves invalidate both source and destination, and deletion revisions survive empty folders.
        Existing global revision tokens are replaced once. Identical builds are shared;
        completed files replace older revisions atomically. Format and algorithm are versioned
        independently. Viewport and point limit apply only on retrieval. Search results are not
        persisted. The cache retains at most 256 files and 512 MiB; larger routes or unavailable
        cache storage use complete uncached computation. HTTP responses remain private, no-store.
      parameters:
      - name: path
        in: query
        schema: {type: string, maxLength: 4096, default: ""}
      - name: q
        in: query
        schema: {type: string, maxLength: 800}
      - name: type
        in: query
        schema: {type: string, enum: [image, video, audio]}
      - name: points
        in: query
        schema: {type: integer, minimum: 32, maximum: 8192, default: 2048}
      - name: south
        in: query
        schema: {type: number, format: double, minimum: -90, maximum: 90}
      - name: north
        in: query
        schema: {type: number, format: double, minimum: -90, maximum: 90}
      - name: west
        in: query
        schema: {type: number, format: double, minimum: -180, maximum: 180}
      - name: east
        in: query
        schema: {type: number, format: double, minimum: -180, maximum: 180}
        description: West greater than east crosses the antimeridian.
      responses:
        '200':
          description: Viewport geometry and full-route bounds. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoRouteGeometry'}
        '400':
          description: Invalid path, query, media type, viewport (invalid_bounds) or point budget (invalid_points).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only path.
        '404':
          description: Folder not found.
        '422':
          description: Complex search exceeds its candidate limit (search_too_broad).
        '503':
          description: Index unavailable (map_index_not_ready). Retry-After is 10 seconds.
        '500':
          description: Internal error.
  /api/photos/v1/map/track:
    get:
      tags: [Photos]
      operationId: readPhotoMapTrack
      summary: Read bounded GPX geometry for a map viewport
      description: >-
        Requires photos.read. Reads a regular, library-relative GPX file through the shared parser
        and cache. Symlinks and admin-only paths are rejected. The file limit is 16 MiB and 100,000
        recorded track/route points; invalid positions split segments. Consecutive points within
        5 metres are reduced within each segment. GPX is parsed lazily with a 32 MiB cache.
        Geometry preserves segment gaps and antimeridian crossings. Supply all four bounds or
        omit all for the world. Returned bounds describe the entire file, while segments contain
        only clipped, simplified geometry for the viewport. At most points coordinates are returned
        across all segments. If endpoints alone exceed the budget, complete segments are sampled
        across the track and omitted_segments reports the number left out. Zooming and requesting
        a smaller viewport can recover additional detail. At most two geometry jobs run per library.
      parameters:
      - name: path
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 4096}
      - name: points
        in: query
        schema: {type: integer, minimum: 32, maximum: 8192, default: 2048}
      - name: south
        in: query
        schema: {type: number, format: double, minimum: -90, maximum: 90}
      - name: north
        in: query
        schema: {type: number, format: double, minimum: -90, maximum: 90}
      - name: west
        in: query
        schema: {type: number, format: double, minimum: -180, maximum: 180}
      - name: east
        in: query
        schema: {type: number, format: double, minimum: -180, maximum: 180}
        description: West greater than east crosses the antimeridian.
      responses:
        '200':
          description: Viewport geometry and full-track bounds. Cache-Control is private, no-store.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoTrackGeometry'}
        '400':
          description: Invalid path, viewport (invalid_bounds) or point budget (invalid_points).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only path.
        '404':
          description: GPX file not found.
        '422':
          description: Invalid GPX (invalid_gpx) or file/point limit exceeded (gpx_too_large).
        '500':
          description: Internal error.
  /api/photos/v1/map/media:
    get:
      tags:
      - Photos
      operationId: readPhotoMapMedia
      summary: Read a bounded media page for a dense GPS location
      description: Requires photos.read. Recursively lists up to 96 indexed media in a geographic bounding box, using exactly the same folder, visibility, type and
        search predicates as the map. All four bounds are required. No originals or metadata are modified.
      parameters:
      - name: path
        in: query
        schema:
          type: string
          default: ''
        description: Library-relative folder. Subfolders are included. Nonempty q searches the whole library.
      - name: q
        in: query
        schema:
          type: string
        description: Shared gallery search syntax, maximum 800 UTF-8 bytes.
      - name: type
        in: query
        schema:
          type: string
          enum:
          - image
          - video
          - audio
      - name: south
        in: query
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
        required: true
      - name: north
        in: query
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
        description: Must be greater than south.
        required: true
      - name: west
        in: query
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
        required: true
      - name: east
        in: query
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
        description: Must differ from west. Use west -180 and east 180 for all longitudes.
        required: true
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      responses:
        '200':
          description: Bounded page. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMapMediaPage'
        '400':
          description: Invalid path, query, type or bounds (invalid_bounds).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only folder.
        '404':
          description: Folder not found.
        '422':
          description: Search exceeds candidate budget (search_too_broad).
        '503':
          description: Photo index not ready (map_index_not_ready). Retry-After is 10 seconds.
        '500':
          description: Internal error.
  /api/photos/v1/browse:
    get:
      tags:
      - Photos
      operationId: browsePhotoCatalog
      summary: Read a bounded native gallery page
      description: Requires photos.read. Pages contain at most 96 media, 24 folders with two previews each, and 20 blog summaries. Folder search totals and sorting include all matching visible folders; results are not truncated to 50. Folder previews are fetched only after slicing the folder page. Blog bodies load on demand. Native listings exclude admin-only content. Existing sorting, search, index and visibility rules are shared with the browser. Page numbers refer to the live library; clients should deduplicate paths if indexing occurs during browsing.
      responses:
        '200':
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogPage'
        '400':
          description: Invalid path, page, section or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '422':
          description: Search too broad; refine the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only content. Error shape follows the access middleware or catalog code.
      parameters:
      - name: path
        in: query
        required: false
        description: Current folder; omitted means root.
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Uses the browser photo-search syntax and searches globally; nonempty q resets path.
        schema:
          type: string
          maxLength: 800
      - name: page
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - name: section
        in: query
        required: false
        description: Empty includes all sections. Subsequent section pages can load independently.
        schema:
          type: string
          enum:
          - ''
          - media
          - folders
          - blogs
          default: ''
      - name: sort
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - ascending_date
          - descending_date
          - ascending_name
          - descending_name
          default: descending_date
      - name: type
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - ''
          - image
          - video
          - audio
      - name: recursive
        in: query
        required: false
        description: List media recursively; folder/blog navigation uses direct listings.
        schema:
          type: string
          enum:
          - '0'
          - '1'
          default: '0'
      - name: gps
        in: query
        required: false
        description: Only media with GPS coordinates.
        schema:
          type: string
          enum:
          - '0'
          - '1'
          default: '0'
  /api/photos/v1/media/info:
    get:
      tags:
      - Photos
      operationId: getPhotoCatalogInfo
      summary: Read original photo metadata
      description: Requires photos.read. Available from BearStack 0.50.0. Does not modify photo content.
      responses:
        '200':
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                type: object
                required:
                - media
                properties:
                  media:
                    $ref: '#/components/schemas/PhotoCatalogMedia'
        '400':
          description: Invalid path, page, section or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '422':
          description: Search too broad; refine the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only content. Error shape follows the access middleware or catalog code.
      parameters:
      - name: path
        in: query
        required: true
        description: Library-relative path. Absolute paths and traversal are rejected.
        schema:
          type: string
  /api/photos/v1/blog:
    get:
      tags:
      - Photos
      operationId: getPhotoCatalogBlog
      summary: Read safe Markdown or text content
      description: Requires photos.read. Reads .md and .txt from the photo library using the shared one-MiB source limit and safe renderer. Private folders, symlinks and traversal are checked before reading.
      responses:
        '200':
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                type: object
                required:
                - blog
                properties:
                  blog:
                    $ref: '#/components/schemas/PhotoCatalogBlog'
        '400':
          description: Invalid path, page, section or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '422':
          description: Search too broad; refine the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only content. Error shape follows the access middleware or catalog code.
      parameters:
      - name: path
        in: query
        required: true
        description: Library-relative path. Absolute paths and traversal are rejected.
        schema:
          type: string
  /api/photos/v1/media:
    get:
      tags:
      - Photos
      operationId: getPhotoCatalogOriginal
      summary: Read media
      description: Requires photos.read. Streams the original file using the existing media implementation. Supports byte ranges and conditional requests.
      responses:
        '200':
          description: Streams the original file using the existing media implementation. Supports byte ranges and conditional requests.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path, page, section or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '422':
          description: Search too broad; refine the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only content. Error shape follows the access middleware or catalog code.
        '206':
          description: Requested byte range.
        '304':
          description: Not modified.
      parameters:
      - name: path
        in: query
        required: true
        description: Library-relative path. Absolute paths and traversal are rejected.
        schema:
          type: string
      - name: v
        in: query
        required: false
        description: Opaque source revision returned in the listing.
        schema:
          type: string
  /api/photos/v1/thumbnail:
    get:
      tags:
      - Photos
      operationId: getPhotoCatalogThumbnail
      summary: Read thumbnail
      description: Requires photos.read. Uses the existing bounded thumbnail generator and private versioned cache policy.
      responses:
        '200':
          description: Uses the existing bounded thumbnail generator and private versioned cache policy.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path, page, section or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '404':
          description: Content not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '422':
          description: Search too broad; refine the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCatalogError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing photos.read or admin-only content. Error shape follows the access middleware or catalog code.
      parameters:
      - name: path
        in: query
        required: true
        description: Library-relative path. Absolute paths and traversal are rejected.
        schema:
          type: string
      - name: v
        in: query
        required: false
        description: Opaque source revision returned in the listing.
        schema:
          type: string
      - name: size
        in: query
        required: false
        description: Requested longest side; the server normalizes supported thumbnail sizes.
        schema:
          type: integer
          minimum: 1
  /api/photos/v1/thumbnail/status:
    post:
      tags:
      - Photos
      operationId: getPhotoCatalogThumbnailStatus
      summary: Check and schedule visible thumbnails in a batch
      description: Requires photos.read. Read-only with respect to photo content; it can schedule derivative thumbnail work. Reuses the browser batch service. Maximum request body 64 KiB; at most 200 requests are processed. Cache-Control is no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                    - path
                    - size
                    properties:
                      path:
                        type: string
                      size:
                        type: integer
                        minimum: 0
                  maxItems: 200
      responses:
        '200':
          description: Thumbnail readiness, Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - size
                      - ready
                      properties:
                        path:
                          type: string
                        size:
                          type: integer
                          minimum: 0
                        ready:
                          type: boolean
                    maxItems: 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/photos/labeling/v1/faces/{id}/favorite:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    get:
      tags: [Photos]
      operationId: getLabelingFaceFavorite
      summary: Read a face's reference favorite status
      description: >-
        Available since BearStack 0.40.0. Requires photos.edit. Returns the current
        person and favorite status of an active face. Private, ignored, removed
        and stale source images are excluded. Cache-Control is private, no-store.
      responses:
        "200":
          description: Current favorite state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FaceFavorite"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Photos]
      operationId: setLabelingFaceFavorite
      summary: Set a face's reference favorite status
      description: >-
        Available since BearStack 0.40.0. Requires photos.edit. Supports named and
        unnamed groups. Set the desired boolean explicitly; repeated identical
        requests are idempotent. person_id must be the current group ID to protect
        against stale assignments. A moved or ignored face returns 409 conflict;
        removed faces return 404. Refresh the group after a conflict. Later explicit
        assignments replace earlier ones; clients should serialize writes per face.
        Favorite state and that person's reference selection are saved atomically.
        All eligible favorites are compared even above the configured reference
        target; remaining slots favor distinct gallery folders. Favorites survive
        reassignment and merging, but ignored/private faces never participate in
        matching. Clients can discover support using session.face_favorites and
        read faces[].favorite on person detail pages. Cache-Control is private,
        no-store. Browser clients must satisfy the same-origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [person_id, favorite]
              properties:
                person_id: {type: integer, format: int64, minimum: 1}
                favorite: {type: boolean}
            example: {person_id: 12, favorite: true}
      responses:
        "200":
          description: Persisted favorite state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FaceFavorite"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Face was moved or ignored. Refresh the group before retrying.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, const: conflict}
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/session:
    get:
      tags: [Photos]
      operationId: getLabelingSession
      summary: Check labeling protocol, identity and rights
      description: |
        Requires photos.edit. Clients must use HTTPS. Protocol 1 is available from
        BearStack 0.30.0. Persist queue state under instance + dataset + account.
        upper_id freezes the next candidate pass. Clearing face data rotates dataset.
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/candidates:
    get:
      tags: [Photos]
      operationId: getLabelingCandidates
      summary: Read unnamed groups within a bounded pass
      description: |
        Requires photos.edit. At most 20 metadata records, ordered by ID, with no
        face images or embeddings. Newer groups are excluded. Before display,
        re-read the group. Detached groups must be placed in a local priority queue.
      parameters:
        - name: after
          in: query
          required: false
          description: Exclusive ID cursor; initially zero.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: upper
          in: query
          required: true
          description: Fixed upper_id returned by the session at the start of this pass.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingCandidates"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/people:
    get:
      tags: [Photos]
      operationId: getLabelingNamedPeople
      summary: List all named people in bounded cursor pages
      description: >-
        Available since 0.43.0, advertised by session.named_people. Requires
        photos.edit. Returns at most 20 nonempty named groups, ordered by ID,
        with a representative portrait face_id and active face count. Supply
        upper_id from a fresh session as upper and the previous next as after.
        Newly created groups above upper appear after refreshing the list.
        Visibility is checked in small batches; protected groups are excluded.
        No total count or face detail arrays are loaded. Cache-Control is private, no-store.
        Since 0.45.0, optional q searches all named groups using case-insensitive
        German folding and literal substring matching. Keep q unchanged while
        advancing the cursor; a changed query starts at after=0.
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, maximum: 4611686018427387904, default: 0}
        - name: upper
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0, maximum: 4611686018427387904}
        - name: q
          in: query
          description: Optional person name substring (at most 800 UTF-8 bytes); advertised by session.named_search.
          schema: {type: string, default: ''}
      responses:
        "200":
          description: Page of named people, including next and has_next.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabelingCandidates'}
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /api/photos/labeling/v1/people/{id}:
    get:
      tags: [Photos]
      operationId: getLabelingPerson
      summary: Read a consistent group revision and a bounded face page
      description: |
        Requires photos.edit. count is the entire active face count, not the page
        size or distinct photo count. Empty, ignored and deleted groups return 404.
        Protected photos are excluded even for administrators.
        Since 0.45.0, limit permits up to 40 faces and after_face selects faces
        with greater IDs using an indexed cursor. If after_face is supplied,
        offset is ignored and the response offset is zero. Clients must compare
        revisions before appending pages and reload on conflict. Defaults retain
        the legacy four-face offset behavior.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: offset
          in: query
          required: false
          description: Zero-based face offset, ignored when after_face is present. Default zero.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 40, default: 4}
        - name: after_face
          in: query
          schema: {type: integer, format: int64, minimum: 0, maximum: 4611686018427387904}
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingPerson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/suggestions:
    get:
      tags: [Photos]
      operationId: getLabelingSuggestions
      summary: Find up to twenty named people
      description: |
        Requires photos.edit. Returns named groups with revisions, preview face IDs
        and total active face counts. No embeddings. Duplicate names are allowed
        only after an explicit allow_duplicate decision on the name action.
      parameters:
        - name: q
          in: query
          required: false
          description: Name substring (maximum 800 UTF-8 bytes).
          schema:
            type: string
        - name: exact
          in: query
          required: false
          description: Set to 1 for a whitespace-normalized, case-sensitive exact name match.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingSuggestions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/merge-suggestions/next:
    get:
      tags: [Photos]
      operationId: getNextLabelingMergeSuggestion
      summary: Read one similar-group decision with both matching portraits
      description: |
        Since 0.49.0; requires photos.edit and session.merge_suggestions.
        Reads at most 20 cached candidates in descending score / ascending ID order;
        never starts vector matching. Returns one currently visible pair or null.
        Each group's faces contains exactly its matching witness, including bounds,
        display_path and original_key. Revisions describe the displayed groups.
        After a confirmed accept_merge/reject_merge action, read this endpoint again.
        Conflicts require a fresh read and an explicit new decision.
      responses:
        "200":
          description: One suggestion or none. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                type: object
                required: [suggestion]
                properties:
                  suggestion:
                    oneOf:
                      - $ref: "#/components/schemas/LabelingMergeSuggestion"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/people/{id}/actions:
    post:
      tags: [Photos]
      operationId: applyLabelingAction
      summary: Atomically label or manage a person with a durable receipt
      description: |
        Requires photos.edit. JSON is limited to 16 KiB.
        name, assign, detach and ignore require an unnamed source.
        Since 0.43.0, rename, unassign and favorite require a named source
        (advertised by session.named_people). rename changes the name without merging.
        unassign moves one face to a new manually unnamed group and clears its
        favorite status, even for the last face. favorite explicitly sets the
        reference favorite for one face; it is not a toggle.
        Since 0.49.0, accept_merge and reject_merge decide a cached similar-group
        suggestion (session.merge_suggestions). Both require suggestion_id,
        target_id and target_revision, matching the displayed source and target.
        Targets may be named or unnamed. accept_merge moves the entire source,
        including ignored faces and favorites, into the target and removes the
        source group; source name/provenance is preserved if the target is unnamed.
        reject_merge retains a durable separation that also vetoes automatic
        reassociation; it changes no faces or group revisions. Both actions and
        their receipts commit atomically and use groups=0; reject_merge uses faces=0.
        All active faces are changed in one transaction with the receipt; there is
        no 500-face limit or client-side batching. Images are never deleted.
        operation_id is unique per account and dataset. An identical replay returns
        the original receipt, including after the source has disappeared. Changed
        content under the same ID returns 409. Source and target revisions must
        match; web edits and background changes also advance revisions.
        A 409 requires a fresh read and a new explicit user decision, with a new ID.
        name_exists allows assignment or separate naming for name; for rename,
        offer a different name or explicit allow_duplicate without merging.
        Ignore undo is a client-side delay BEFORE sending this request.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelingAction"
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "409":
          description: Stale source/target revision, reused operation ID, changed dataset or existing name.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, enum: [conflict, name_exists]}

  /api/photos/labeling/v1/actions/{operation}:
    get:
      tags: [Photos]
      operationId: getLabelingReceipt
      summary: Resolve an action after a lost response
      description: |
        Requires photos.edit. Only the requesting account can retrieve its receipt.
        404 means no receipt in this dataset; the client may resend the identical
        saved request. Receipts remain available until face data is cleared.
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
        - name: dataset
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelingReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/faces/{id}/thumbnail:
    get:
      tags: [Photos]
      operationId: getLabelingFaceImage
      summary: Get an authorized face crop
      description: Requires photos.edit. Protected and ignored faces are excluded; no embeddings or original photos are returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: size
          in: query
          required: false
          description: Small or enlarged face crop size. Use the original endpoint for the full source photo.
          schema:
            type: integer
            format: int64
            minimum: 0
            enum: [160, 640]
            default: 160
      responses:
        "200":
          description: Square JPEG crop. Cache-Control is private, no-store.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/photos/labeling/v1/faces/{id}/original:
    get:
      tags: [Photos]
      operationId: getLabelingFaceOriginal
      summary: Get the full original photo containing a face
      description: >-
        Available since BearStack 0.33.0. Requires photos.edit. Streams the
        unchanged source file, preserving its dimensions and metadata. The path
        is resolved from the face ID; protected and ignored faces are excluded.
        Responses use Cache-Control no-store. Supports HTTP byte ranges.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: Range
          in: header
          schema: {type: string}
          description: Optional byte range, for example bytes=0-1023.
      responses:
        "200":
          description: Original photo with its source MIME type.
          content:
            "image/*":
              schema: {type: string, format: binary}
        "206":
          description: Requested byte range of the original photo.
          content:
            "image/*":
              schema: {type: string, format: binary}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested byte range cannot be satisfied.
        "500":
          $ref: "#/components/responses/InternalServerError"

  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check service health
      description: Requires authentication when authentication is enabled.
      responses:
        "200":
          description: The HTTP service is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPIDescription
      summary: Download this OpenAPI description
      description: |
        Returns the OpenAPI description embedded in the running BearStack
        version. Requires any document or photo API capability.
      responses:
        "200":
          description: OpenAPI description in YAML format.
          content:
            application/yaml:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/upload:
    post:
      tags: [Upload]
      operationId: uploadDocuments
      summary: Upload one or more documents
      description: |
        Imports every file part as a document. Files exceeding the configured
        upload limit, unsupported file types and duplicates are reported per
        item. Requires the `documents.upload` capability.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
            encoding:
              files:
                style: form
                explode: true
      responses:
        "201":
          description: |
            The request was processed and at least one file was imported, was a
            duplicate, or did not produce a per-file error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: No document was imported and at least one error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Search and list documents
      description: |
        Returns a paginated list using the same filters as the web interface.
        Search strings shorter than three Unicode characters are ignored.
        Requires the `documents.read` capability.

        Custom field filters use dynamic query parameter names in the form
        `field_{id}`, for example `field_3=ACME`. The first non-empty value per
        field is used and matching is case-insensitive.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagsQuery"
        - name: field_{id}
          in: query
          description: |
            Custom field value filter. Replace `{id}` in the parameter name
            with a positive custom field ID, for example `field_3`.
          schema:
            type: string
        - name: from
          in: query
          description: Earliest document date. Ignored when `year` is valid.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Latest document date. Ignored when `year` is valid.
          schema:
            type: string
            format: date
        - name: year
          in: query
          description: Document year; takes precedence over `from` and `to`.
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - name: month
          in: query
          description: Optional month when a valid `year` is supplied.
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: sort
          in: query
          description: Unknown values fall back to `upload_date`.
          schema:
            type: string
            enum: [upload_date, date, name, title, size, deleted_at]
            default: upload_date
        - name: dir
          in: query
          description: |
            Sort direction. Defaults to `asc` for name/title and `desc` for all
            other sort keys.
          schema:
            type: string
            enum: [asc, desc]
        - name: trash
          in: query
          description: |
            Lists deleted documents for `1`, `true`, `yes` or `ja`
            (case-insensitive).
          schema:
            oneOf:
              - type: boolean
              - type: string
                enum: ["1", "true", "yes", "ja"]
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated document result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/documents/{id}/download:
    get:
      tags: [Documents]
      operationId: downloadDocumentFromAPI
      summary: Download an original document through the API alias
      description: Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document or stored file not found.

  /api/fields:
    get:
      tags: [Structure]
      operationId: listCustomFields
      summary: List custom field definitions
      description: Requires the `documents.read` capability.
      responses:
        "200":
          description: Custom field definitions in display order.
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomField"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/folders:
    get:
      tags: [Structure]
      operationId: listVirtualFolder
      summary: List a virtual folder
      description: |
        Traverses BearStack's virtual hierarchy of tags, custom field values and
        saved searches. Requires the `documents.read` capability.

        `path` is the preferred representation and accepts repeated segments:
        `tag:{name}` or `field:{fieldId}:{exactValue}`. When `path` is absent,
        repeated `tags` values provide the legacy tags-only representation.

        At the root only child folders are returned. Documents are returned once
        at least one normal path segment is selected. The special legacy path
        `tags=00 Suchfavoriten` lists saved searches, and a second tag selects
        one. Search, date and trash query filters are ignored for normal virtual
        folders.
      parameters:
        - name: path
          in: query
          description: Ordered virtual path segments.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: "^(tag:.+|field:[1-9][0-9]*:.+)$"
        - $ref: "#/components/parameters/TagsQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Child folders and documents at the selected path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/tags:
    get:
      tags: [Structure]
      operationId: listTags
      summary: List document tags
      description: Requires the `documents.read` capability.
      responses:
        "200":
          description: All document tags.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/download:
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: Download an original document
      description: Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          $ref: "#/components/responses/DocumentFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document or stored file not found.

  /documents/{id}/preview:
    get:
      tags: [Documents]
      operationId: previewDocument
      summary: Retrieve an inline document preview
      description: |
        Returns the original PDF/image or a generated PDF for supported office
        and text formats. Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Inline original or generated preview.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document not found.
        "415":
          description: This document type cannot be previewed.
        "503":
          description: Preview dependency is unavailable.

  /documents/{id}/thumbnail:
    get:
      tags: [Documents]
      operationId: getDocumentThumbnail
      summary: Retrieve a document thumbnail
      description: |
        Generates the thumbnail on demand when possible. Requires the
        `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: JPEG thumbnail.
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=86400
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Document or thumbnail not found.

  /documents/{id}/tags:
    post:
      tags: [Documents]
      operationId: replaceDocumentTags
      summary: Replace all tags on a document
      description: |
        Existing tags can be assigned with `documents.edit`. Creating a new tag
        additionally requires `documents.structure`. Deleted documents cannot be
        changed. Send `Accept: application/json`.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
            encoding:
              tags:
                style: form
                explode: true
      responses:
        "200":
          description: Normalized, stored tag names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTags"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/metadata:
    post:
      tags: [Documents]
      operationId: updateDocumentMetadata
      summary: Update document metadata
      description: |
        Replaces title, description, date, tags and custom field values.
        Custom fields use form field names `field_{id}`, for example `field_3`.
        Existing tags can be assigned with `documents.edit`; creating a new tag
        additionally requires `documents.structure`. Send
        `Accept: application/json`.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                document_date:
                  description: Empty to clear the date.
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      maxLength: 0
                tags:
                  type: array
                  items:
                    type: string
                new_tags:
                  type: string
                  description: Additional comma-separated tags.
                field_{id}:
                  type: string
                  description: |
                    Custom field value. Replace `{id}` in the form field name
                    with a positive custom field ID.
              additionalProperties:
                type: string
            encoding:
              tags:
                style: form
                explode: true
      responses:
        "200":
          description: Selected values from the updated metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/document-date:
    post:
      tags: [Documents]
      operationId: updateDocumentDate
      summary: Update only the document date
      description: Requires `documents.edit` and always returns JSON.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                document_date:
                  description: Empty to clear the date.
                  oneOf:
                    - type: string
                      format: date
                    - type: string
                      maxLength: 0
      responses:
        "200":
          description: Formatted updated date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDateUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{id}/ocr/status:
    get:
      tags: [Documents]
      operationId: getDocumentOCRStatus
      summary: Get the latest OCR job
      description: Requires the `documents.read` capability.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
      responses:
        "200":
          description: Latest OCR job, or `null` when none exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OCRStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /photos/people/groups:
    get:
      tags: [Photos]
      operationId: getGroupPhotos
      summary: Browse group photos with remaining unnamed faces
      description: >-
        Available since 0.41.0. Requires photos.edit. Without path, returns the first
        eligible photo after the path cursor, in ascending path order. Eligibility
        requires strictly more than min faces whose person has no name and which
        are not ignored. Private, missing and stale sources are excluded. A path
        selects the current photo even after its remaining count falls below min;
        path takes precedence over after. All recognized faces, including named and
        ignored ones, are included in the photo detail. No embeddings are exposed.
        Skipping advances only the cursor; it never changes stored face data.
        Omit after and path to start a new pass. HTML by default; request format=json
        or Accept application/json for JSON. Cache-Control is private, no-store.
      parameters:
        - name: min
          in: query
          schema: {type: integer, minimum: 0, maximum: 255, default: 5}
          description: Exclusive threshold for remaining faces; five means at least six.
        - name: after
          in: query
          schema: {type: string, maxLength: 4096}
          description: Gallery-relative path cursor; omitted starts at the beginning.
        - name: path
          in: query
          schema: {type: string, minLength: 1, maxLength: 4096}
          description: Read this current photo regardless of its remaining count.
        - name: format
          in: query
          schema: {type: string, enum: [json]}
      responses:
        '200':
          description: Current photo, or null when no eligible photo remains.
          content:
            text/html:
              schema: {type: string}
            application/json:
              schema: {$ref: '#/components/schemas/GroupPhotosPage'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/people/groups/ignore:
    post:
      tags: [Photos]
      operationId: ignoreGroupPhotoRemainingFaces
      summary: Ignore remaining unnamed faces or one selected face in the current photo
      description: >-
        Available since 0.41.0. Requires photos.edit and the browser same-origin
        policy. Pass the path and revision of the displayed photo. The revision is
        checked in the same write transaction as the selection and mutation. Named
        or already ignored faces and faces in other photos are never affected.
        A changed snapshot returns 409 without partial edits; refresh the photo
        before retrying. JSON success acknowledges only the write. Then GET the
        group photo view using after=path to advance. If this GET fails, retry only
        navigation. HTML form success redirects to the next eligible photo.
        Since 0.45.0, an optional positive face_id limits the write to that single
        unnamed, active detection in this photo, including when its person has other
        detections in the same photo. Invalid, empty, repeated or unrelated face_id
        values return 400 and never fall back to ignoring all remaining faces.
        Named or already ignored selections return 409. In single-face mode, refresh
        with path=path instead of advancing; HTML redirects back to the same photo.
        For naming and assignment, the UI uses the existing whole-person rename/merge
        endpoints, not individual-face movement. Responses use Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [path, revision]
              properties:
                path: {type: string, minLength: 1, maxLength: 4096}
                revision: {type: string, minLength: 64, maxLength: 64, description: Opaque snapshot revision from GroupPhoto.}
                min: {type: integer, minimum: 0, maximum: 255, default: 5, description: Threshold retained for the HTML redirect.}
                face_id: {type: integer, format: int64, minimum: 1, description: "Since 0.45.0, ignore only this active unnamed detection in the displayed photo. Omit to ignore all remaining faces."}
      responses:
        '200':
          description: Write completed for requests with Accept application/json.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ignored]
                properties:
                  ok: {type: boolean, const: true}
                  ignored: {type: integer, minimum: 0, maximum: 256}
        '303':
          description: Redirect to the next eligible photo for HTML forms, or the current photo when face_id is supplied.
          headers:
            Location:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Photo changed; refresh and review the remaining faces.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, const: conflict}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/people/groups/image/{id}:
    get:
      tags: [Photos]
      operationId: getGroupPhotoImage
      summary: Get the proportionally fitted full-photo preview for a face
      description: >-
        Available since 0.41.0. Requires photos.edit. Resolves the original from a
        recognized face, including ignored faces still present in the group editor.
        Reuses the EXIF-oriented gallery preview of at most 1600 pixels. Falls back
        to the original when no thumbnail backend is available. Private, removed
        or replaced sources are rejected. Returns an image with Cache-Control no-store.
        Face bounds are normalized in the EXIF-oriented image, not in the square
        face thumbnails; clients must account for letterboxing when highlighting.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Full-photo preview, or original fallback.
          content:
            'image/*':
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/people:
    get:
      tags:
      - Photos
      operationId: listPhotoPeople
      summary: List automatically grouped people
      description: 'Requires photos.read. HTML by default; format=json or Accept: application/json
        returns a page of at most 60 groups. With ignored=1, returns up to 60 individual
        ignored faces in faces and an empty people array. Since 0.44.0, unknown=1
        lists only unnamed groups with active faces, overriding known and ignored.
        Ignored faces do not contribute portraits or photo counts in this mode.
        Admin-only photos are excluded. Since 0.47.0, filter selects one of all, known, unknown or ignored and overrides the legacy flags. Overview entries additionally include the representative portrait bounds and its relative directory, resolved in the paginated query.
        Since 0.42.0, format=suggestions returns the first 60 named groups for the web
        autocomplete, with id, name, distinct-photo count and has_next. Since 0.43.0,
        each suggestion also includes face_id for the same active portrait as the people
        overview, served by /photos/faces/{id}/thumbnail. This mode
        applies q but ignores page, filter, known, unknown and ignored; it performs current visibility
        and imported-name-source checks without calculating total pages.
        Cache-Control is private, no-store.'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: q
        in: query
        schema:
          type: string
      - name: ignored
        in: query
        description: Set to 1 to list ignored faces, including faces in groups without active faces. Combines with q, known and pagination.
        schema:
          type: string
          enum: ['0', '1']
          default: '0'
      - name: known
        in: query
        description: Set to 1 to list only people with a non-empty name; combines with q and pagination.
        schema:
          type: string
          enum: ['0', '1']
          default: '0'
      - name: unknown
        in: query
        description: Since 0.44.0, set to 1 for unnamed person groups with active, non-ignored faces only. Overrides known=1 and ignored=1; combines with q and pagination. Ignored by format=suggestions and person-detail routes.
        schema:
          type: string
          enum: ['0', '1']
          default: '0'
      - name: filter
        in: query
        description: Since 0.47.0, exclusive overview filter. Overrides known, unknown and ignored when supplied; all lists active groups. Ignored by suggestions and person-detail routes.
        schema:
          type: string
          enum: [all, known, unknown, ignored]
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - suggestions
        description: Request the complete JSON page or the bounded named-person autocomplete response.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PhotoPeoplePage'
                - $ref: '#/components/schemas/PhotoPeopleSuggestions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /photos/people/merge-suggestions:
    get:
      tags: [Photos]
      operationId: listFaceMergeSuggestions
      summary: Review similar person groups
      description: >-
        Requires photos.edit. HTML by default; format=json returns up to 60 cached
        suggestions ordered by score. Page views never run vector matching. Current
        visibility and group revisions are checked. Suggestions include unconfirmed
        unnamed fragments; similarity is not an identity probability.
        Cache-Control is private, no-store. No embeddings are returned.
      parameters:
      - name: format
        in: query
        schema: {type: string, enum: [json]}
      responses:
        '200':
          description: Cached suggestions or the review page.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    maxItems: 60
                    items: {$ref: '#/components/schemas/FaceMergeSuggestion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /photos/people/merge-suggestions/{id}/{action}:
    post:
      tags: [Photos]
      operationId: reviewFaceMergeSuggestion
      summary: Accept or reject a suggested group merge
      description: >-
        Requires photos.edit and same-origin write protection. Accept atomically
        merges the first group into the second using both displayed revisions.
        Stale suggestions return 409 and require a fresh review. Reject records a
        durable identity separation that also vetoes automatic reassociation
        between the groups. Neither operation writes originals or XMP.
        With Accept application/json returns ok; HTML forms redirect to the list.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [accept, reject]}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [source_revision, target_revision]
              properties:
                source_revision: {type: integer, format: int64, minimum: 1}
                target_revision: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean, const: true}
        '303':
          description: Operation completed; redirects to the review page.
          headers:
            Location:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Suggestion or either group changed; reload and review again.
  /photos/people/{id}:
    get:
      tags:
      - Photos
      operationId: getPhotoPerson
      summary: List faces assigned to one person
      description: 'Requires photos.read. HTML by default; format=json or Accept: application/json
        returns at most 60 faces. Empty/hidden groups return 404.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
        description: Request JSON instead of HTML.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPeoplePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /photos/faces/{id}/thumbnail:
    get:
      tags:
      - Photos
      operationId: getFaceThumbnail
      summary: Get a face crop
      description: Requires photos.read. Checks current filesystem visibility; generated
        crops use private browser caching with mandatory revalidation and ETags.
        Matching If-None-Match returns 304 only after authentication and visibility
        checks. Encoded crops are cached in the configured photo cache.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 160 x 160 JPEG face preview.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Cached face preview is unchanged; no response body.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/people/{id}/rename:
    post:
      tags:
      - Photos
      operationId: renamePhotoPerson
      summary: Name or rename a person
      description: Requires photos.edit. Form writes redirect to the corresponding
        HTML page; Accept application/json returns an OK object without redirect. Existing authentication, same-origin protection and audit logging
        apply.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
              required: []
      responses:
        '200':
          description: Saved (Accept application/json); response is not cached.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/people/{id}/merge:
    post:
      tags:
      - Photos
      operationId: mergePhotoPeople
      summary: Merge source group into target
      description: Requires photos.edit. Form writes redirect to the corresponding
        HTML page. Existing authentication, same-origin protection and audit logging
        apply. Additional person_id sources merge atomically (at most 60 distinct sources,
        excluding the target). An unnamed target inherits the first non-empty source
        name, including its provenance; a named target keeps its name. Accept
        application/json returns 200 with ok true. Optional new_name atomically renames the target while merging; it must be non-empty.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                new_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Optional manual target name applied in the merge transaction.
                person_id:
                  type: array
                  description: Additional source group IDs; repeated form field.
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                target:
                  type: integer
                  format: int64
                  minimum: 1
              required:
              - target
      responses:
        '200':
          description: Groups merged (Accept application/json).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/faces/{id}/favorite:
    post:
      tags: [Photos]
      operationId: setPhotoFaceFavoriteForm
      summary: Set a reference favorite from a person detail form
      description: >-
        Available since BearStack 0.40.0. Requires photos.edit and same-origin
        browser requests. HTML fallback for the web favorite button. The expected
        person and explicit desired state follow the JSON favorite API contract.
        Success always redirects to the person detail page, preserving page.
        Errors use JSON with error and code. API clients should prefer the PUT
        endpoint under /api/photos/labeling/v1/faces/{id}/favorite.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [person_id, favorite]
              properties:
                person_id: {type: integer, format: int64, minimum: 1}
                favorite: {type: string, enum: ['0', '1']}
                page: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      responses:
        '303':
          description: Favorite saved; redirect to the person detail page.
          headers:
            Location:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The face was moved to another group or ignored; refresh before retrying.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /photos/faces/edit:
    post:
      tags:
      - Photos
      operationId: editPhotoFaces
      summary: Move selected faces or ignore false detections
      description: Requires photos.edit. Form writes redirect to the corresponding
        HTML page; requests with Accept application/json receive HTTP 200 with an ok flag. Existing authentication, same-origin protection and audit logging
        apply.
      parameters: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                face_id:
                  type: array
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                  minItems: 1
                  maxItems: 500
                action:
                  type: string
                  enum:
                  - move
                  - ignore
                target:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Existing target person ID; 0 or omitted creates a new
                    person for move.
                name:
                  type: string
                  maxLength: 200
                  description: Name for the new person. Required and non-blank when ignored=1, action=move and target=0. Moving an ignored face restores it.
                ignored:
                  type: string
                  enum: ['0', '1']
                  description: Set to 1 to return HTML form submissions to the ignored-face filter.
                q:
                  type: string
                  description: Name filter preserved in the ignored-face HTML redirect.
                known:
                  type: string
                  enum: ['0', '1']
                  description: Named-only filter preserved in the ignored-face HTML redirect.
                page:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: Page preserved in the ignored-face HTML redirect.
              required:
              - face_id
              - action
      responses:
        '200':
          description: Saved (Accept application/json).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings/photos/faces:
    get:
      tags:
      - Photos
      operationId: getFaceRecognitionSettings
      summary: Recognition settings and progress
      description: Requires photos.manage. HTML by default; format=json returns settings
        and status. Service tokens and vectors are never returned. Since 0.41.1,
        progress=1 with format=json reads indexed counts without a filesystem scan
        or per-file error list. Counts share a snapshot for at most five seconds;
        newly private/deleted sources affect counts after index/visibility refresh.
        Concrete face access always performs fresh source and visibility checks.
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
        description: Request JSON instead of HTML.
      - name: progress
        in: query
        schema:
          type: integer
          enum: [1]
        description: Lightweight indexed counts for JSON polling; omits status.errors. Without this flag, the complete status performs fresh visibility checks.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceSettingsStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Photos
      operationId: saveFaceRecognitionSettings
      summary: Configure optional face recognition
      description: Requires photos.manage. Form writes redirect to the corresponding
        HTML page. Existing authentication, same-origin protection and audit logging
        apply.
      parameters: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum:
                  - '1'
                  description: Omit to pause. Activation requires a healthy, compatible
                    configured service.
                reconcile_enabled:
                  type: string
                  enum: ['0', '1']
                  description: >-
                    Enable or pause stored-vector reassociation independently of
                    inference. Default enabled. Omission preserves the saved value.
                batch_size:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
                delay_millis:
                  type: integer
                  minimum: 100
                  maximum: 60000
                  default: 1000
                reference_limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
                  description: Target references per person. All eligible favorites are included,
                    even above this target. Remaining slots favor distinct gallery folders.
                    Omission preserves the existing value. Changes refresh stored references
                    before the next analysis or reassociation, without analyzing photos again.
                    The independent stored-vector worker also schedules a new pass.
                interval_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 15
              required: []
      responses:
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings/photos/faces/{action}:
    post:
      tags:
      - Photos
      operationId: controlFaceRecognition
      summary: Control inference, stored-vector reassociation or delete recognition data
      description: Requires photos.manage. Form writes redirect to the corresponding
        HTML page. Existing authentication, same-origin protection and audit logging
        apply. Since 0.48.0, reconcile schedules a new stored-vector pass and enables
        its independent worker; reconcile-pause stops it while retaining the cursor;
        reconcile-resume continues it. These three actions do not need an inference
        service. Clear disables both workers and removes reconciliation state and
        suggestions. The clear action additionally requires the current password of the
        authenticated user; failed confirmation leaves data and processing unchanged.
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - pause
          - resume
          - retry
          - clear
          - reconcile
          - reconcile-pause
          - reconcile-resume
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  enum:
                  - delete
                  description: Required for clear; deletes generated data and disables
                    processing, preserving XMP.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: Required for clear; current password of the authenticated user.
              required: []
      responses:
        '303':
          description: Saved; Location points to the corresponding page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Too many failed password confirmations.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/media/info:
    get:
      tags:
      - Photos
      operationId: getPhotoMetadata
      summary: Get photo metadata, including automatic faces
      description: Requires photos.read. Existing faces contains imported XMP regions;
        automatic_faces is a separate additive field. Neither includes embeddings.
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    $ref: '#/components/schemas/PhotoFaceMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Photos
      operationId: getPhotoMetadataBatch
      summary: Get metadata for up to 100 media paths
      description: Requires photos.read; read-only batch endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paths
              properties:
                paths:
                  type: array
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhotoFaceMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /photos/frame/items:
    get:
      tags:
      - Photos
      operationId: getPhotoFrameItems
      summary: Get a paginated photo listing for frames
      description: Requires photos.read. Supports the existing photo search syntax;
        automatic_faces is additive and contains no internal vectors.
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          maximum: 500
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhotoFaceMetadata'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                  has_next:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Credentials configured for the BearStack instance.
    sessionCookie:
      type: apiKey
      in: cookie
      name: bearstack_session
      description: Signed session cookie created by the web login.

  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      description: Positive document ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchQuery:
      name: q
      in: query
      description: Full-text search; values shorter than three characters are ignored.
      schema:
        type: string
    TagsQuery:
      name: tags
      in: query
      description: Repeated tag names; all selected tags must match.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Page:
      name: page
      in: query
      description: One-based page number. Invalid values fall back to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: |
        Number of documents per page. When omitted, the instance setting is
        used. Other values are rejected.
      schema:
        type: integer
        enum: [25, 50, 100, 200, 500]

  responses:
    BadRequest:
      description: Invalid request parameters or form data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Basic realm="BearStack", charset="UTF-8"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: The authenticated account lacks the required capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal error with implementation details masked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Interner Serverfehler
    DocumentFile:
      description: Original document file.
      headers:
        Content-Disposition:
          description: Attachment filename in ASCII and RFC 5987 form.
          schema:
            type: string
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary

  schemas:
    PhotoCatalogError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    PhotoCatalogMedia:
      type: object
      required:
      - path
      - name
      - type
      - mime
      - version
      - modified
      - bytes
      - width
      - height
      properties:
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - image
          - video
          - audio
        mime:
          type: string
        version:
          type: string
          description: Opaque source revision used as v in media URLs.
        modified:
          type: string
          format: date-time
        captured:
          type: string
          format: date-time
        bytes:
          type: integer
          format: int64
          minimum: 0
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        camera:
          type: string
        lens:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        rating:
          type: number
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        faces:
          type: array
          items:
            type: object
        automatic_faces:
          type: array
          items:
            type: object
    PhotoCatalogBlog:
      type: object
      required:
      - path
      - name
      - modified
      properties:
        path:
          type: string
        name:
          type: string
        date:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        text:
          type: string
          description: Full text only on the blog endpoint.
        html:
          type: string
          description: Escaped server formatting; full content only on the blog endpoint. Never needs a WebView.
    PhotoCatalogFolder:
      type: object
      required:
      - path
      - name
      - media_count
      - approximate
      - folder_count
      - previews
      properties:
        path:
          type: string
        name:
          type: string
        date:
          type: string
          format: date-time
        media_count:
          type: integer
          minimum: 0
        approximate:
          type: boolean
        folder_count:
          type: integer
          minimum: 0
        previews:
          type: array
          items:
            $ref: '#/components/schemas/PhotoCatalogMedia'
          maxItems: 2
    PhotoCatalogSession:
      type: object
      required:
      - protocol
      - instance
      - dataset
      - account
      - can_manage_people
      - settings
      properties:
        protocol:
          type: integer
          const: 1
        instance:
          type: string
        dataset:
          type: string
        account:
          type: string
        can_manage_people:
          type: boolean
        settings:
          type: object
          required:
          - thumbnail_size
          - folder_thumbnail_size
          - preview_size
          - large_preview_size
          - slideshow_seconds
          - frame_seconds
          properties:
            thumbnail_size:
              type: integer
              minimum: 0
            folder_thumbnail_size:
              type: integer
              minimum: 0
            preview_size:
              type: integer
              minimum: 0
            large_preview_size:
              type: integer
              minimum: 0
            slideshow_seconds:
              type: integer
              minimum: 0
            frame_seconds:
              type: integer
              minimum: 0
    PhotoTrackInventory:
      type: object
      required: [tracks, cursor, previous_cursor, has_next, has_previous, ready]
      properties:
        tracks:
          type: array
          maxItems: 32
          items:
            type: object
            required: [path, name, modified, bytes]
            properties:
              path: {type: string}
              name: {type: string}
              modified: {type: string, format: date-time}
              bytes: {type: integer, format: int64, minimum: 0}
        cursor: {type: string}
        previous_cursor: {type: string}
        has_next: {type: boolean}
        has_previous: {type: boolean}
        ready: {type: boolean}
    PhotoTrackGeometry:
      allOf:
      - $ref: '#/components/schemas/PhotoMapGeometry'
      - type: object
        properties:
          total_points:
            type: integer
            maximum: 100000
            description: Parsed GPX point count after reducing nearby points, before viewport clipping.
    PhotoRouteGeometry:
      allOf:
      - $ref: '#/components/schemas/PhotoMapGeometry'
      - type: object
        required: [total_media, radius_meters]
        properties:
          total_media: {type: integer, minimum: 0, description: Number of GPS media contributing to the complete chronological route.}
          radius_meters: {type: integer, enum: [500, 1000, 1500, 2000, 3000, 5000, 7500, 10000]}
          total_points:
            type: integer
            description: Complete grouped place count before clipping and simplification, without a collection-size cap.
    PhotoMapGeometry:
      type: object
      required: [path, name, segments, total_points, simplified, omitted_segments]
      properties:
        path: {type: string}
        name: {type: string}
        bounds: {$ref: '#/components/schemas/PhotoMapBounds'}
        segments:
          type: array
          maxItems: 8192
          items:
            type: array
            maxItems: 8192
            items:
              type: array
              minItems: 2
              maxItems: 2
              prefixItems:
              - {type: number, format: double, minimum: -90, maximum: 90}
              - {type: number, format: double, minimum: -180, maximum: 180}
          description: Independent segments of [latitude,longitude] pairs; never connect different segments.
        total_points:
          type: integer
          minimum: 0
          description: Complete point or place count before viewport clipping and simplification.
        simplified: {type: boolean}
        omitted_segments: {type: integer, minimum: 0}
    PhotoMap:
      type: object
      required: [total, markers]
      properties:
        total:
          type: integer
          minimum: 0
        bounds:
          $ref: '#/components/schemas/PhotoMapBounds'
        markers:
          type: array
          maxItems: 289
          items:
            type: object
            required: [latitude, longitude, count, bounds]
            properties:
              latitude: {type: number, format: double, minimum: -90, maximum: 90}
              longitude: {type: number, format: double, minimum: -180, maximum: 180}
              count: {type: integer, minimum: 1}
              bounds:
                $ref: '#/components/schemas/PhotoMapBounds'
              path:
                type: string
                description: Library-relative media path, present only for single-item markers.
    PhotoMapMediaPage:
      type: object
      required:
      - total
      - page
      - has_next
      - media
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        has_next:
          type: boolean
        media:
          type: array
          maxItems: 96
          items:
            $ref: '#/components/schemas/PhotoCatalogMedia'
    PhotoMapBounds:
      type: object
      description: Geographic extent of matching items. Omitted for an empty result. Coordinates may coincide for a single location; west greater than east crosses the antimeridian.
      required: [south, west, north, east]
      properties:
        south: {type: number, format: double, minimum: -90, maximum: 90}
        west: {type: number, format: double, minimum: -180, maximum: 180}
        north: {type: number, format: double, minimum: -90, maximum: 90}
        east: {type: number, format: double, minimum: -180, maximum: 180}
    PhotoCatalogPage:
      type: object
      required:
      - path
      - parent
      - page
      - total
      - has_next
      - folder_total
      - folder_has_next
      - blog_has_next
      - media
      - folders
      - blogs
      properties:
        path:
          type: string
        parent:
          type: string
        page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        folder_total:
          type: integer
          minimum: 0
        folder_has_next:
          type: boolean
        blog_has_next:
          type: boolean
        media:
          type: array
          items:
            $ref: '#/components/schemas/PhotoCatalogMedia'
          maxItems: 96
        folders:
          type: array
          items:
            $ref: '#/components/schemas/PhotoCatalogFolder'
          maxItems: 24
        blogs:
          type: array
          items:
            $ref: '#/components/schemas/PhotoCatalogBlog'
          maxItems: 20

    GroupPhotosPage:
      type: object
      required: [minimum, photo]
      properties:
        minimum: {type: integer, minimum: 0, maximum: 255, default: 5}
        photo:
          oneOf:
            - $ref: '#/components/schemas/GroupPhoto'
            - type: 'null'
    GroupPhoto:
      type: object
      required: [path, display_path, revision, remaining, image_face_id, faces]
      properties:
        path: {type: string, description: Gallery-relative source path and cursor.}
        display_path: {type: string, description: Human-readable gallery path.}
        revision: {type: string, minLength: 64, maxLength: 64, description: Opaque revision protecting bulk ignore.}
        remaining: {type: integer, minimum: 0, maximum: 256}
        image_face_id: {type: integer, format: int64, minimum: 1, description: Face ID usable with the group photo image endpoint.}
        faces:
          type: array
          minItems: 1
          maxItems: 256
          description: All detections including named and ignored faces, ordered by ID.
          items: {$ref: '#/components/schemas/RecognizedPhotoFace'}
    FaceFavorite:
      type: object
      required: [id, person_id, favorite]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        person_id: {type: integer, format: int64, minimum: 1}
        favorite: {type: boolean}
    LabelingSession:
      type: object
      required: [protocol, instance, dataset, account, upper_id, can_manage]
      properties:
        merge_suggestions: {type: boolean, const: true, description: "One-pair review and receipted accept_merge/reject_merge actions since 0.49.0. Older servers omit this field."}
        named_people: {type: boolean, const: true, description: "Named people list and rename/unassign/favorite receipt actions available since 0.43.0. Older servers omit this field."}
        named_search: {type: boolean, const: true, description: "Name search, 40-face cursor pages and receipt source_revision available since 0.45.0. Older servers omit this field."}
        face_favorites: {type: boolean, const: true, description: "Favorite API available since 0.40.0. Older servers omit this field."}
        protocol: {type: integer, const: 1}
        instance: {type: string, description: Stable identity of this photo database.}
        dataset: {type: string, description: Changes when detected face data is cleared.}
        account: {type: string, description: Opaque stable account identity; do not parse.}
        upper_id: {type: integer, format: int64, minimum: 0}
        can_manage: {type: boolean, const: true, description: "Person-editing access granted by photos.edit; retained field name for client compatibility."}
    LabelingPerson:
      type: object
      required: [id, name, revision, count, face_id, offset]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        count: {type: integer, format: int64, minimum: 1}
        face_id: {type: integer, format: int64, description: Representative active face for suggestions.}
        offset: {type: integer, minimum: 0}
        faces:
          type: array
          maxItems: 40
          description: Present on a detail page with faces. Empty pages can omit this field.
          items:
            type: object
            required: [id, display_path, bounds, favorite]
            properties:
              id: {type: integer, format: int64, minimum: 1}
              favorite: {type: boolean, description: "Reference favorite status since 0.40.0. Older servers omit this field."}
              original_key:
                type: string
                pattern: '^[a-f0-9]{64}$'
                description: >-
                  Optional opaque original-image identity since 0.43.1. Shared by
                  faces from the same source; changes when indexed size or modification
                  time changes. Scoped to the connected instance, dataset and account
                  by the client. Android 0.6.1 uses this for a bounded decoded-bitmap
                  memory cache with a fixed 180-second lifetime from loading; cache
                  hits do not extend it. HTTP responses remain private, no-store.
                  Older servers omit it; clients fall back to the individual face URL.
              display_path:
                type: string
                description: >-
                  Complete gallery-relative display path including Fotos, every
                  folder formatted with gallery breadcrumb rules, and the unchanged
                  filename. Contains no absolute host path. Available since 0.34.0.
                example: Fotos / 11.05.2026 · Urlaub / IMG_1234.jpg
              bounds:
                type: object
                required: [x, y, width, height]
                description: >-
                  Normalized face rectangle in the complete original after EXIF
                  rotation/mirroring, with origin at its top left. Available since
                  0.35.0. Clients clip the rectangle to the image edges.
                properties:
                  x: {type: number, format: double}
                  y: {type: number, format: double}
                  width: {type: number, format: double, exclusiveMinimum: 0}
                  height: {type: number, format: double, exclusiveMinimum: 0}
    LabelingCandidates:
      type: object
      required: [people, next, has_next]
      properties:
        people:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/LabelingPerson"}
        next: {type: integer, format: int64, minimum: 0}
        has_next: {type: boolean}
    LabelingSuggestions:
      type: object
      required: [people]
      properties:
        people:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/LabelingPerson"}
    LabelingMergeSuggestion:
      type: object
      required: [id, source, target]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        source:
          allOf:
            - $ref: "#/components/schemas/LabelingPerson"
          description: First group; faces contains exactly the source witness, also used as face_id.
        target:
          allOf:
            - $ref: "#/components/schemas/LabelingPerson"
          description: Second group; faces contains exactly the target witness, also used as face_id.
    LabelingAction:
      type: object
      additionalProperties: false
      required: [operation_id, dataset, revision, action]
      properties:
        operation_id: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        dataset: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [name, assign, detach, ignore, rename, unassign, favorite, accept_merge, reject_merge]}
        suggestion_id: {type: integer, format: int64, minimum: 1, description: Required cached suggestion ID for accept_merge/reject_merge since 0.49.0.}
        name: {type: string, maxLength: 200, description: Required and nonempty for name or rename; whitespace normalized.}
        allow_duplicate: {type: boolean, default: false, description: Explicitly allow a separate group with the same name.}
        target_id: {type: integer, format: int64, description: Named target for assign; displayed target for accept_merge/reject_merge.}
        target_revision: {type: integer, format: int64, description: Expected target revision for assign or accept_merge/reject_merge.}
        face_id: {type: integer, format: int64, description: One active source face for detach/unassign/favorite; only detach requires at least two faces.}
        favorite: {type: boolean, description: Required explicit desired state for the favorite action.}
    LabelingReceipt:
      type: object
      required: [operation_id, action, source_id, target_id, new_id, faces, groups, at]
      properties:
        source_revision: {type: integer, format: int64, minimum: 0, description: "Optional since 0.45.0. Source revision at commit (zero if absent). Preserved on replay; use for local updates, never as proof of the latest server state."}
        operation_id: {type: string}
        action: {type: string, enum: [name, assign, detach, ignore, rename, unassign, favorite, accept_merge, reject_merge]}
        source_id: {type: integer, format: int64}
        target_id: {type: integer, format: int64, description: Assignment or merge-decision target; otherwise zero.}
        new_id: {type: integer, format: int64, description: New unnamed group for detach/unassign or zero.}
        faces: {type: integer, format: int64, minimum: 0, description: Actually affected active face count; zero for reject_merge.}
        groups: {type: integer, enum: [0, 1], description: Zero for detach/rename/unassign/favorite/accept_merge/reject_merge; one for name/assign/ignore.}
        at: {type: integer, format: int64, description: Server confirmation time in Unix seconds.}

