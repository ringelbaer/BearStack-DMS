          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /photos/frame/items:
    get:
      tags:
      - Photos
      operationId: getPhotoFrameItems
      summary: Get a paginated photo listing for frames
      description: Requires photos.read. Supports the existing photo search syntax;
        automatic_faces is additive and contains no internal vectors.
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          maximum: 500
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhotoFaceMetadata'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                  has_next:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Credentials configured for the BearStack instance.
    sessionCookie:
      type: apiKey
      in: cookie
      name: bearstack_session
      description: Signed session cookie created by the web login.

  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      description: Positive document ID.
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchQuery:
      name: q
      in: query
      description: Full-text search; values shorter than three characters are ignored.
      schema:
        type: string
    TagsQuery:
      name: tags
      in: query
      description: Repeated tag names; all selected tags must match.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Page:
      name: page
      in: query
      description: One-based page number. Invalid values fall back to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: |
        Number of documents per page. When omitted, the instance setting is
        used. Other values are rejected.
      schema:
        type: integer
        enum: [25, 50, 100, 200, 500]

  responses:
    BadRequest:
      description: Invalid request parameters or form data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Basic realm="BearStack", charset="UTF-8"
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: The authenticated account lacks the required capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal error with implementation details masked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Interner Serverfehler
    DocumentFile:
      description: Original document file.
      headers:
        Content-Disposition:
          description: Attachment filename in ASCII and RFC 5987 form.
          schema:
            type: string
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary

  schemas:
    GroupPhotosPage:
      type: object
      required: [minimum, photo]
      properties:
        minimum: {type: integer, minimum: 0, maximum: 255, default: 5}
        photo:
          oneOf:
            - $ref: '#/components/schemas/GroupPhoto'
            - type: 'null'
    GroupPhoto:
      type: object
      required: [path, display_path, revision, remaining, image_face_id, faces]
      properties:
        path: {type: string, description: Gallery-relative source path and cursor.}
        display_path: {type: string, description: Human-readable gallery path.}
        revision: {type: string, minLength: 64, maxLength: 64, description: Opaque revision protecting bulk ignore.}
        remaining: {type: integer, minimum: 0, maximum: 256}
        image_face_id: {type: integer, format: int64, minimum: 1, description: Face ID usable with the group photo image endpoint.}
        faces:
          type: array
          minItems: 1
          maxItems: 256
          description: All detections including named and ignored faces, ordered by ID.
          items: {$ref: '#/components/schemas/RecognizedPhotoFace'}
    FaceFavorite:
      type: object
      required: [id, person_id, favorite]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        person_id: {type: integer, format: int64, minimum: 1}
        favorite: {type: boolean}
    LabelingSession:
      type: object
      required: [protocol, instance, dataset, account, upper_id, can_manage]
      properties:
        face_favorites: {type: boolean, const: true, description: "Favorite API available since 0.40.0. Older servers omit this field."}
        protocol: {type: integer, const: 1}
        instance: {type: string, description: Stable identity of this photo database.}
        dataset: {type: string, description: Changes when detected face data is cleared.}
        account: {type: string, description: Opaque stable account identity; do not parse.}
        upper_id: {type: integer, format: int64, minimum: 0}
        can_manage: {type: boolean, const: true, description: "Person-editing access granted by photos.edit; retained field name for client compatibility."}
    LabelingPerson:
      type: object
      required: [id, name, revision, count, face_id, offset]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        count: {type: integer, format: int64, minimum: 1}
        face_id: {type: integer, format: int64, description: Representative active face for suggestions.}
        offset: {type: integer, minimum: 0}
        faces:
          type: array
          maxItems: 4
          description: Present on a detail page with faces. Empty pages can omit this field.
          items:
            type: object
            required: [id, display_path, bounds, favorite]
            properties:
              id: {type: integer, format: int64, minimum: 1}
              favorite: {type: boolean, description: "Reference favorite status since 0.40.0. Older servers omit this field."}
              display_path:
                type: string
                description: >-
                  Complete gallery-relative display path including Fotos, every
                  folder formatted with gallery breadcrumb rules, and the unchanged
                  filename. Contains no absolute host path. Available since 0.34.0.
                example: Fotos / 11.05.2026 · Urlaub / IMG_1234.jpg
              bounds:
                type: object
                required: [x, y, width, height]
                description: >-
                  Normalized face rectangle in the complete original after EXIF
                  rotation/mirroring, with origin at its top left. Available since
                  0.35.0. Clients clip the rectangle to the image edges.
                properties:
                  x: {type: number, format: double}
                  y: {type: number, format: double}
                  width: {type: number, format: double, exclusiveMinimum: 0}
                  height: {type: number, format: double, exclusiveMinimum: 0}
    LabelingCandidates:
      type: object
      required: [people, next, has_next]
      properties:
        people:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/LabelingPerson"}
        next: {type: integer, format: int64, minimum: 0}
        has_next: {type: boolean}
    LabelingSuggestions:
      type: object
      required: [people]
      properties:
        people:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/LabelingPerson"}
    LabelingAction:
      type: object
      additionalProperties: false
      required: [operation_id, dataset, revision, action]
      properties:
        operation_id: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        dataset: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        action: {type: string, enum: [name, assign, detach, ignore]}
        name: {type: string, maxLength: 200, description: Required and nonempty for name; whitespace normalized.}
        allow_duplicate: {type: boolean, default: false, description: Explicitly allow a separate group with the same name.}
        target_id: {type: integer, format: int64, description: Named target for assign.}
        target_revision: {type: integer, format: int64, description: Expected target revision for assign.}
        face_id: {type: integer, format: int64, description: One source face for detach; source must contain at least two faces.}
    LabelingReceipt:
      type: object
      required: [operation_id, action, source_id, target_id, new_id, faces, groups, at]
      properties:
        operation_id: {type: string}
        action: {type: string, enum: [name, assign, detach, ignore]}
        source_id: {type: integer, format: int64}
        target_id: {type: integer, format: int64, description: Assignment target or zero.}
        new_id: {type: integer, format: int64, description: New detached group or zero.}
        faces: {type: integer, format: int64, minimum: 1, description: Actually affected active face count.}
        groups: {type: integer, enum: [0, 1], description: Zero for detach; one for name/assign/ignore.}
        at: {type: integer, format: int64, description: Server confirmation time in Unix seconds.}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    UploadResult:
      type: object
      required: [uploaded, duplicates, errors]
      properties:
        uploaded:
          type: array
          items:
            $ref: "#/components/schemas/UploadedDocument"
        duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateDocument"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/UploadError"

    UploadedDocument:
      type: object
      required:
        - id
        - filename
        - title
        - upload_way
        - content_text_source
        - content_text_source_label
        - size_bytes
        - document_url
        - download_url
        - preview_url
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        filename:
          type: string
        title:
          type: string
        upload_way:
          type: string
          const: api
        content_text_source:
          $ref: "#/components/schemas/ContentTextSource"
        content_text_source_label:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        document_url:
          type: string
        download_url:
          type: string
        preview_url:
          type: string
        document_date:
          type: string
          format: date

    DuplicateDocument:
      type: object
      required: [filename, existing_id, existing_filename, document_url]
      properties:
        filename:
          type: string
        existing_id:
          type: integer
          format: int64
          minimum: 1
        existing_filename:
          type: string
        document_url:
          type: string

    UploadError:
      type: object
      required: [filename, error]
      properties:
        filename:
          type: string
        error:
          type: string

    DocumentList:
      type: object
      required: [documents, filter, pagination]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        filter:
          $ref: "#/components/schemas/DocumentFilter"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Document:
      type: object
      required:
        - id
        - original_name
        - title
        - description
        - tags
        - custom_values
        - mime_type
        - size_bytes
        - sha256
        - upload_way
        - upload_way_label
        - content_text_source
        - content_text_source_label
        - uploaded_at
        - updated_at
        - duplicate_count
        - linked_count
        - document_url
        - download_url
        - preview_url
        - thumbnail_url
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        original_name:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        custom_values:
          type: array
          items:
            $ref: "#/components/schemas/DocumentCustomValue"
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
        upload_way:
          type: string
          enum: [web, api, mail, webdav]
        upload_way_label:
          type: string
        content_text_source:
          $ref: "#/components/schemas/ContentTextSource"
        content_text_source_label:
          type: string
        document_date:
          type: string
          format: date
        uploaded_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        duplicate_count:
          type: integer
          minimum: 0
        linked_count:
          type: integer
          minimum: 0
        document_url:
          type: string
        download_url:
          type: string
        preview_url:
          type: string
        thumbnail_url:
          type: string

    ContentTextSource:
      type: string
      enum: [pdf, file, raw, ocr, none, unknown]

    DocumentCustomValue:
      type: object
      required: [field_id, label, value]
      properties:
        field_id:
          type: integer
          format: int64
          minimum: 1
        label:
          type: string
        value:
          type: string

    DocumentFilter:
      type: object
      required:
        - query
        - tags
        - custom_fields
        - sort
        - direction
        - trash
      properties:
        query:
          type: string
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldFilter"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        year:
          type: integer
          minimum: 1900
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
        sort:
          type: string
          enum: [upload_date, date, name, title, size, deleted_at]
        direction:
          type: string
          enum: [asc, desc]
        trash:
          type: boolean

    CustomFieldFilter:
      type: object
      required: [field_id, value]
      properties:
        field_id:
          type: integer
          format: int64
          minimum: 1
        value:
          type: string

    Pagination:
      type: object
      required: [page, per_page, total, start, end, has_prev, has_next]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          enum: [25, 50, 100, 200, 500]
        total:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        has_prev:
          type: boolean
        has_next:
          type: boolean

    CustomField:
      type: object
      required:
        - id
        - label
        - position
        - autocomplete_enabled
        - value_folder_min_documents
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        label:
          type: string
        position:
          type: integer
          minimum: 0
        autocomplete_enabled:
          type: boolean
        value_folder_min_documents:
          description: |
            `0` disables value folders, `1` always shows them, and higher
            values are the minimum matching document count.
          type: integer
          enum: [0, 1, 5, 10, 20, 50]

    FolderResult:
      type: object
      required: [selected_tags, folders, documents, pagination]
      properties:
        selected_tags:
          type: array
          items:
            type: string
        selected_path:
          description: |
            Present for normal tag/field paths. Legacy saved-search responses
            omit this property.
          type: array
          items:
            $ref: "#/components/schemas/FolderPathSegment"
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        pagination:
          $ref: "#/components/schemas/Pagination"

    FolderPathSegment:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [tag, field]
        tag:
          type: string
        field_id:
          type: integer
          format: int64
          minimum: 1
        field_label:
          type: string
        value:
          type: string
        label:
          type: string

    Folder:
      allOf:
        - $ref: "#/components/schemas/Tag"
        - type: object
          description: |
            A tag, custom-field-value or saved-search folder. Folder-specific
            properties are populated according to `kind`.
          properties:
            kind:
              type: string
              enum: [field_value, search_favorites_root, search_favorite]
            favorite_id:
              type: integer
              format: int64
              minimum: 1
            field_id:
              type: integer
              format: int64
              minimum: 1
            field_label:
              type: string
            value:
              type: string

    Tag:
      type: object
      required:
        - id
        - name
        - display_name
        - description
        - color
        - primary_tag
        - group_mode
        - list_hidden
        - delete_protected
        - style
        - count
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        color:
          type: string
        primary_tag:
          type: boolean
        group_mode:
          type: boolean
        list_hidden:
          type: boolean
        delete_protected:
          type: boolean
        style:
          type: string
        count:
          type: integer
          minimum: 0

    DocumentTags:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: string

    MetadataUpdateResult:
      type: object
      required: [title, document_date, document_date_input, tags, notice]
      properties:
        title:
          type: string
        document_date:
          type: string
          description: Localized display date (`DD.MM.YYYY`) or an empty string.
        document_date_input:
          type: string
          description: ISO date (`YYYY-MM-DD`) or an empty string.
        tags:
          type: array
          items:
            type: string
        notice:
          type: string

    DocumentDateUpdateResult:
      type: object
      required: [document_date, document_date_input, notice]
      properties:
        document_date:
          type: string
          description: Localized display date (`DD.MM.YYYY`) or an empty string.
        document_date_input:
          type: string
          description: ISO date (`YYYY-MM-DD`) or an empty string.
        notice:
          type: string

    OCRStatus:
      type: object
      required: [job]
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/OCRJob"
            - type: "null"

    OCRJob:
      type: object
      required:
        - id
        - document_id
        - language
        - language_label
        - status
        - status_text
        - active
        - terminal
        - current_page
        - total_pages
        - progress_percent
        - text_length
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        document_id:
          type: integer
          format: int64
          minimum: 1
        language:
          type: string
        language_label:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, interrupted]
        status_text:
          type: string
        active:
          type: boolean
        terminal:
          type: boolean
        current_page:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        text_length:
          type: integer
          minimum: 0
        message:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    RecognizedPhotoFace:
      type: object
      required:
      - id
      - person_id
      - name
      - path
      - x
      - y
      - width
      - height
      - manual
      - ignored
      - favorite
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        person_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          maximum: 1
        height:
          type: number
          minimum: 0
          maximum: 1
        manual:
          type: boolean
        ignored:
          type: boolean
        favorite:
          type: boolean
          description: Reference favorite since 0.40.0; ignored faces retain the flag but never participate in matching.
    PhotoPerson:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        count:
          type: integer
          description: Distinct visible photos.
        face_id:
          type: integer
          format: int64
          minimum: 1
    PhotoPeoplePage:
      type: object
      properties:
        total_pages:
          type: integer
          minimum: 1
          description: Total pages for the current filters; at least 1 even for empty results. Requested page numbers are clamped to this range.
        ignored_only:
          type: boolean
          description: Whether the overview lists individual ignored faces.
        known_only:
          type: boolean
          description: Whether the overview is filtered to named people.
        query:
          type: string
        people:
          type: array
          items:
            $ref: '#/components/schemas/PhotoPerson'
        faces:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedPhotoFace'
        person_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        page:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
    PhotoFaceMetadata:
      type: object
      description: Existing media fields remain unchanged; only automatic_faces is new.
      additionalProperties: true
      properties:
        path:
          type: string
        faces:
          type: array
          description: Existing imported XMP data.
          items:
            type: object
            properties:
              name:
                type: string
              left:
                type: number
                minimum: 0
                maximum: 1
              top:
                type: number
                minimum: 0
                maximum: 1
              width:
                type: number
                minimum: 0
                maximum: 1
              height:
                type: number
                minimum: 0
                maximum: 1
        automatic_faces:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedPhotoFace'
    FaceSettingsStatus:
      type: object
      properties:
        settings:
          type: object
          properties:
            enabled:
              type: boolean
            batch_size:
              type: integer
            delay_millis:
              type: integer
            reference_limit:
              type: integer
              minimum: 1
              maximum: 100
              default: 30
              description: Reference target; all eligible favorites are included even above this number.
            interval_minutes:
              type: integer
        status:
          type: object
          properties:
            errors:
              type: array
              maxItems: 20
              items:
                type: object
                properties:
                  path:
                    type: string
                  error:
                    type: string
                  attempts:
                    type: integer
            queued:
              type: integer
              minimum: 0
            done:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            faces:
              type: integer
              minimum: 0
            people:
              type: integer
              minimum: 0
        running:
          type: boolean
        configured:
          type: boolean
        error:
          type: string
