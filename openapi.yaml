          format: date-time

    RecognizedPhotoFace:
      type: object
      required:
      - id
      - person_id
      - name
      - path
      - x
      - y
      - width
      - height
      - manual
      - ignored
      - favorite
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        person_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          maximum: 1
        height:
          type: number
          minimum: 0
          maximum: 1
        manual:
          type: boolean
        ignored:
          type: boolean
        favorite:
          type: boolean
          description: Reference favorite since 0.40.0; ignored faces retain the flag but never participate in matching.
    PhotoPerson:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        count:
          type: integer
          description: Distinct visible photos.
        face_id:
          type: integer
          format: int64
          minimum: 1
        directory:
          type: string
          description: Since 0.47.0, relative parent directory of the representative active portrait; Fotos for the photo root. Other photos of the person may be in other directories.
        portrait:
          type: object
          description: Since 0.47.0, normalized bounds of face_id in the oriented photo. Used for the naming dialog's 300-percent bounding-box preview.
          required: [x, y, width, height]
          properties:
            x: {type: number}
            y: {type: number}
            width: {type: number}
            height: {type: number}
    PhotoPeopleSuggestions:
      type: object
      additionalProperties: false
      required: [people, has_next]
      properties:
        people:
          type: array
          maxItems: 60
          items:
            type: object
            additionalProperties: false
            required: [id, name, count, face_id]
            properties:
              id:
                type: integer
                format: int64
                minimum: 1
              name:
                type: string
                minLength: 1
              count:
                type: integer
                minimum: 1
                description: Distinct visible photos with active faces in this group.
              face_id:
                type: integer
                format: int64
                minimum: 1
                description: Since 0.43.0, representative active face matching the people overview; load /photos/faces/{id}/thumbnail for its portrait. Visibility is checked again on image access.
        has_next:
          type: boolean
          description: More named groups match; narrow q to find them. No total count is calculated.
    PhotoPeoplePage:
      type: object
      properties:
        total_pages:
          type: integer
          minimum: 1
          description: Total pages for the current filters; at least 1 even for empty results. Requested page numbers are clamped to this range.
        ignored_only:
          type: boolean
          description: Whether the overview lists individual ignored faces.
        known_only:
          type: boolean
          description: Whether the overview is filtered to named people.
        unknown_only:
          type: boolean
          description: Since 0.44.0, whether only unnamed groups with active faces are listed. When true, known_only and ignored_only are false.
        query:
          type: string
        people:
          type: array
          items:
            $ref: '#/components/schemas/PhotoPerson'
        faces:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedPhotoFace'
        person_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        page:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
    PhotoFaceMetadata:
      type: object
      description: Existing media fields remain unchanged; only automatic_faces is new.
      additionalProperties: true
      properties:
        path:
          type: string
        faces:
          type: array
          description: Existing imported XMP data.
          items:
            type: object
            properties:
              name:
                type: string
              left:
                type: number
                minimum: 0
                maximum: 1
              top:
                type: number
                minimum: 0
                maximum: 1
              width:
                type: number
                minimum: 0
                maximum: 1
              height:
                type: number
                minimum: 0
                maximum: 1
        automatic_faces:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedPhotoFace'
    FaceMergeSuggestion:
      type: object
      required: [id, source_id, target_id, source_revision, target_revision, source_face_id, target_face_id, source_name, target_name, score]
      properties:
        id: {type: integer, format: int64}
        source_id: {type: integer, format: int64}
        target_id: {type: integer, format: int64}
        source_revision: {type: integer, format: int64}
        target_revision: {type: integer, format: int64}
        source_face_id: {type: integer, format: int64}
        target_face_id: {type: integer, format: int64}
        source_name: {type: string}
        target_name: {type: string}
        score: {type: number, description: 'Cosine similarity of supporting references, not an identity probability.'}
    FaceReconciliationProgress:
      type: object
      required: [pending, cursor, upper, processed, reassigned, suggestions]
      properties:
        pending: {type: boolean}
        cursor: {type: integer, format: int64, minimum: 0}
        upper: {type: integer, format: int64, minimum: 0}
        processed: {type: integer, format: int64, minimum: 0, description: 'Source rows examined in the current or last pass, including skipped groups.'}
        reassigned: {type: integer, format: int64, minimum: 0}
        suggestions: {type: integer, format: int64, minimum: 0, description: 'New suggestion pairs created in the current or last pass.'}
    FaceSettingsStatus:
      type: object
      properties:
        settings:
          type: object
          properties:
            reconcile_enabled:
              type: boolean
              default: true
              description: Independent worker for existing embeddings; does not require an inference service.
            enabled:
              type: boolean
            batch_size:
              type: integer
            delay_millis:
              type: integer
            reference_limit:
              type: integer
              minimum: 1
              maximum: 100
              default: 30
              description: Reference target; all eligible favorites are included even above this number.
            interval_minutes:
              type: integer
        status:
          type: object
          properties:
            errors:
              type: array
              maxItems: 20
              items:
                type: object
                properties:
                  path:
                    type: string
                  error:
                    type: string
                  attempts:
                    type: integer
            queued:
              type: integer
              minimum: 0
            done:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            faces:
              type: integer
              minimum: 0
            people:
              type: integer
              minimum: 0
        reconciliation:
          $ref: '#/components/schemas/FaceReconciliationProgress'
        reconciliation_running: {type: boolean}
        reconciliation_error: {type: string}
        running:
          type: boolean
        configured:
          type: boolean
        error:
          type: string
