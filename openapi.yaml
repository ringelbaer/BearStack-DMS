        upload_way_label:
          type: string
        content_text_source:
          $ref: "#/components/schemas/ContentTextSource"
        content_text_source_label:
          type: string
        document_date:
          type: string
          format: date
        uploaded_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
