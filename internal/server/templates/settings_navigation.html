{{define "settings-tab-list"}}
<nav class="settings-tab-list" aria-label="Einstellungen">
  {{if .Auth.CanSystemManage}}
  <a class="settings-tab-button {{if eq .SettingsTab "main"}}active{{end}}" {{if eq .SettingsTab "main"}}aria-current="page"{{end}} href="/settings">Dokumente</a>
  <a class="settings-tab-button {{if eq .SettingsTab "mail_import"}}active{{end}}" {{if eq .SettingsTab "mail_import"}}aria-current="page"{{end}} href="/settings/mail-import">E-Mail-Import</a>
  {{end}}
  {{if and .PhotoModuleEnabled .Auth.CanPhotosManage}}<a class="settings-tab-button {{if eq .SettingsTab "photos"}}active{{end}}" {{if eq .SettingsTab "photos"}}aria-current="page"{{end}} href="/settings/photos">Fotos</a>{{end}}
  {{if .Auth.CanSystemUsersManage}}<a class="settings-tab-button {{if eq .SettingsTab "users"}}active{{end}}" {{if eq .SettingsTab "users"}}aria-current="page"{{end}} href="/settings/users">Nutzer</a>{{end}}
</nav>
{{end}}
