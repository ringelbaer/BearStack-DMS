openapi: 3.1.0
info:
  title: BearStack private face inference
  version: 1.1.0
security:
- bearer: []
paths:
  /health:
    get:
      responses:
        '200':
          description: Ready after pinned model checksums pass.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    const: true
                  protocol:
                    const: 1
                  model:
                    const: yunet-2023mar-sface-2021dec-v1
        '401':
          description: Invalid token.
  /v1/analyze:
    post:
      description: Upright JPEG; max 8 MiB, 1600 px edge, 256 faces. No file paths
        or URLs.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Normalized boxes and vectors, with optional recognition-quality metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    const: yunet-2023mar-sface-2021dec-v1
                  faces:
                    type: array
                    maxItems: 256
                    items:
                      type: object
                      properties:
                        x:
                          type: number
                          minimum: 0
                          maximum: 1
                        y:
                          type: number
                          minimum: 0
                          maximum: 1
                        width:
                          type: number
                          minimum: 0
                          maximum: 1
                        height:
                          type: number
                          minimum: 0
                          maximum: 1
                        confidence:
                          type: number
                          minimum: 0
                          maximum: 1
                        embedding:
                          type: array
                          minItems: 128
                          maxItems: 128
                          items:
                            type: number
                        quality:
                          type: object
                          description: |
                            Additive metadata; older services omit this object.
                            Detection confidence does not express identity quality.
                            Values describe the pixels used for this embedding.
                          required: [face_pixels, sharpness, reference_eligible]
                          properties:
                            face_pixels:
                              type: number
                              exclusiveMinimum: 0
                              maximum: 1600
                              description: Shorter side of the clipped detected face in input pixels.
                            sharpness:
                              type: number
                              minimum: 0
                              maximum: 1000000000
                              description: Laplacian variance of the central 80x80 grayscale area of the aligned 112x112 crop.
                            reference_eligible:
                              type: boolean
                              description: Engineering floor of at least 48 face pixels and sharpness of at least 20; not a calibrated identity probability.
        '401':
          description: Invalid token.
        '413':
          description: Invalid body size.
        '415':
          description: JPEG required.
        '422':
          description: Invalid image.
        '429':
          description: Inference busy.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
